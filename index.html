<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Número, la rana — Juegos del proyecto</title>
<style>
/* ============================================================
   EL JARDÍN DE NÚMERO — dirección de arte
   Sólo presentación: colores, capas, ilustración y movimiento.
   ============================================================ */
:root{
  /* tinta (una sola familia, verdosa) */
  --ink:#10261C;
  --ink-2:#2F5245;
  --ink-3:#567A6B;
  --ink-4:#8DA99E;
  --line:#DCE7DE;
  --line-2:#EBF1EA;

  /* papel del cuaderno */
  --paper:#FFFCF2;
  --paper-2:#F8F2E1;
  --paper-3:#EFE6D0;
  --rule:#D8E7E3;
  --margin:#EFA79D;

  /* VERDE → progreso y respuestas correctas */
  --leaf:#2FA05E;
  --leaf-d:#227A48;
  --leaf-dd:#16532F;
  --leaf-b:#5CC488;
  --leaf-bb:#9BE0B4;
  --leaf-l:#DDF2E4;
  --leaf-ll:#F0FAF3;

  /* AMARILLO → recompensa y atención */
  --sun:#F2B02A;
  --sun-d:#A9760A;
  --sun-b:#FFD873;
  --sun-l:#FFF4D9;
  --sun-ink:#3E2A05;

  /* AZUL / CELESTE → información y cielo */
  --sky:#9CDCF2;
  --sky-2:#C7ECF8;
  --sky-l:#E7F6FC;
  --blue:#3B7CC9;
  --blue-d:#295A96;
  --blue-l:#E4EFFB;

  /* JARDÍN → rosa, naranja, violeta, tierra */
  --petal:#EC5F92;
  --petal-d:#BF3D6E;
  --petal-l:#FDE9F0;
  --orange:#F0813C;
  --orange-d:#C25C1D;
  --violet:#9268D6;
  --violet-d:#6C46AC;
  --violet-l:#EFE7FC;
  --soil:#B27B4C;
  --soil-d:#8B5C33;
  --soil-l:#D9BB92;
  --wood:#C08E5C;
  --wood-d:#8E6236;

  /* categorías de bloques (píldoras de pista) — tonos oscuros para texto blanco */
  --c-evento:#A9760A;
  --c-movimiento:#2A578F;
  --c-control:#AE6510;
  --c-apariencia:#5E3B96;
  --c-lapiz:#0A6D57;

  /* espaciado (escala 4) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px; --s9:56px;

  /* radios */
  --r1:12px; --r2:18px; --r3:26px; --r4:34px;

  /* elevación por capas */
  --e0:0 1px 2px rgba(16,38,28,.06);
  --e1:0 2px 4px rgba(16,38,28,.08), 0 1px 2px rgba(16,38,28,.04);
  --e2:0 6px 14px -6px rgba(16,38,28,.22), 0 2px 4px rgba(16,38,28,.06);
  --e3:0 14px 28px -14px rgba(16,38,28,.34), 0 3px 8px rgba(16,38,28,.08);
  --e4:0 28px 56px -26px rgba(16,38,28,.44), 0 6px 16px rgba(16,38,28,.10);

  --font:system-ui,-apple-system,"Segoe UI Variable Display","Segoe UI",Cantarell,"Noto Sans","DejaVu Sans",sans-serif;
  --mono:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.7,.25,1);
  --bounce:cubic-bezier(.34,1.42,.5,1);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font);
  color:var(--ink);
  font-size:16px;
  line-height:1.55;
