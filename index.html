<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Número, la rana — Juegos del proyecto</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  /* neutros (tinta verdosa, una sola familia) */
  --ink:#13241D;
  --ink-2:#3A4F45;
  --ink-3:#688075;
  --ink-4:#9BAFA5;
  --line:#E2E7E1;
  --line-2:#EDF0EA;

  /* papel */
  --paper:#FCFAF4;
  --paper-2:#F4F1E7;
  --rule:#E6EBE3;
  --margin:#DFB0A6;

  /* verde (primario) */
  --leaf:#2F8A5B;
  --leaf-d:#246E48;
  --leaf-dd:#1A5335;
  --leaf-l:#E6F2EA;
  --leaf-ll:#F2F8F4;

  /* sol (acento único) */
  --sun:#E5A21F;
  --sun-d:#B87F0C;
  --sun-l:#FBF0D8;

  /* usos puntuales */
  --soil:#A87B4E;
  --soil-d:#8A6339;
  --petal:#C9527A;
  --petal-l:#FAE9EF;

  /* categorías de bloques */
  --c-evento:#D79A26;
  --c-movimiento:#3D77C4;
  --c-control:#CE7429;
  --c-apariencia:#7C5EC0;
  --c-lapiz:#189176;

  /* escala de espacio: 4 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px; --s9:56px;

  /* radios: 10 / 14 / 20 */
  --r1:10px; --r2:14px; --r3:20px;

  /* elevación */
  --e0:0 1px 1px rgba(19,36,29,.04);
  --e1:0 1px 2px rgba(19,36,29,.06), 0 1px 1px rgba(19,36,29,.03);
  --e2:0 2px 6px rgba(19,36,29,.07), 0 1px 2px rgba(19,36,29,.04);
  --e3:0 18px 40px -22px rgba(19,36,29,.42), 0 2px 6px rgba(19,36,29,.05);

  --font:system-ui,-apple-system,"Segoe UI",Cantarell,"Noto Sans","DejaVu Sans",sans-serif;
  --mono:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.7,.25,1);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  color:var(--ink);
  font-size:16px;
  line-height:1.55;
  background:linear-gradient(180deg,#EDF3EE 0%,#E4EDE7 40%,#DFE9E2 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.app{max-width:960px;margin:0 auto;padding:var(--s6) var(--s4) var(--s9);}

h1,h2,h3{font-weight:750;letter-spacing:-.021em;margin:0;line-height:1.18;}
p{margin:0;}
.eyebrow{
  font-size:12px;letter-spacing:.02em;color:var(--ink-3);font-weight:600;margin:0;
}
.svg-ico{
  width:1em;height:1em;display:inline-block;vertical-align:-.14em;fill:none;
  stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.svg-ico.fill{fill:currentColor;stroke:none;}
::selection{background:var(--leaf-l);}

/* foco único en todo el producto */
:focus-visible{outline:2.5px solid var(--leaf);outline-offset:2px;}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  background:#fff;border-radius:var(--r3);overflow:hidden;box-shadow:var(--e3);
}
#escena{display:block;width:100%;height:auto;}
.hero-bar{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:var(--s4);padding:var(--s5) var(--s6) var(--s5);
  border-top:1px solid var(--line-2);
}
.hero-bar h1{font-size:clamp(21px,3vw,27px);margin-top:2px;}
.hero-bar .lema{font-size:13.5px;color:var(--ink-3);margin-top:var(--s1);}

.marcador{min-width:190px;}
.marcador .top{display:flex;align-items:baseline;gap:var(--s2);}
.marcador .estrella{color:var(--sun);font-size:15px;align-self:center;display:flex;}
.marcador .cifra{
  font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.marcador .lbl{font-size:12.5px;color:var(--ink-3);}
.marcador .barra{
  height:5px;border-radius:99px;background:var(--line);margin-top:var(--s2);overflow:hidden;
}
.marcador .relleno{
  height:100%;width:0;border-radius:99px;background:var(--leaf);
  transition:width .65s var(--ease);
}
.marcador.pulso .cifra{animation:pop .4s var(--ease);}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.13);}100%{transform:scale(1);}}
.chip-suma{
  position:fixed;font-family:var(--mono);font-weight:600;font-size:13.5px;color:var(--leaf-d);
  pointer-events:none;z-index:60;animation:sube .95s var(--ease) forwards;
}
@keyframes sube{
  0%{opacity:0;transform:translateY(4px);}
  22%{opacity:1;transform:translateY(-2px);}
  100%{opacity:0;transform:translateY(-30px);}
}

/* ============================================================
   CAMINO DE ETAPAS
   ============================================================ */
.camino{margin:var(--s6) 0 var(--s5);}
.rail{
  display:flex;gap:var(--s2);overflow-x:auto;padding:var(--s1) 2px var(--s3);
  scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:rgba(19,36,29,.16) transparent;
}
.rail::-webkit-scrollbar{height:5px;}
.rail::-webkit-scrollbar-thumb{background:rgba(19,36,29,.15);border-radius:99px;}
.rail::-webkit-scrollbar-track{background:transparent;}
.etapa-card{
  flex:none;width:164px;scroll-snap-align:start;text-align:left;cursor:pointer;
  background:#fff;border:1px solid var(--line);border-radius:var(--r2);
  padding:var(--s3);box-shadow:var(--e0);font-family:inherit;color:var(--ink);
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease), background .2s var(--ease);
}
.etapa-card:hover{border-color:var(--ink-4);box-shadow:var(--e2);transform:translateY(-1px);}
.etapa-card .fila1{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);}
.etapa-card .badge{
  font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;
}
.etapa-card .estado{margin-left:auto;display:flex;font-size:15px;color:var(--ink-4);}
.etapa-card .nom{
  font-size:13px;font-weight:650;line-height:1.35;letter-spacing:-.012em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px;
}
.etapa-card .dots{display:flex;gap:3px;margin-top:var(--s3);}
.etapa-card .dots i{flex:1;height:3px;border-radius:99px;background:var(--line);transition:background .3s var(--ease);}
.etapa-card .dots i.on{background:var(--leaf);}

.etapa-card.bloqueada{background:var(--paper-2);border-color:transparent;box-shadow:none;}
.etapa-card.bloqueada .nom{color:var(--ink-3);}
.etapa-card.bloqueada .dots i{background:rgba(19,36,29,.08);}
.etapa-card.completa .estado{color:var(--leaf);}
.etapa-card.activa{
  border-color:var(--leaf);box-shadow:inset 0 0 0 1px var(--leaf), var(--e2);
}
.etapa-card.activa .badge{color:var(--leaf-d);}

/* ============================================================
   HOJA
   ============================================================ */
.hoja{
  position:relative;background:var(--paper);border-radius:var(--r3);
  box-shadow:var(--e3);padding:var(--s7) var(--s7) var(--s7) var(--s9);overflow:hidden;
}
.hoja::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom, transparent 0 33px, var(--rule) 33px 34px);
  opacity:.5;
}
.hoja::after{
  content:"";position:absolute;top:0;bottom:0;left:38px;width:1px;
  background:var(--margin);opacity:.45;pointer-events:none;
}
.espiral{
  position:absolute;top:var(--s7);bottom:var(--s7);left:15px;width:9px;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-between;
}
.espiral i{
  width:9px;height:9px;border-radius:50%;background:#EAEDE6;
  box-shadow:inset 0 1px 1.5px rgba(19,36,29,.22);
}
.hoja > *{position:relative;z-index:1;}

.enc{margin-bottom:var(--s6);}
.enc h2{font-size:clamp(20px,2.4vw,25px);margin-top:var(--s1);}
.titulo-act{font-size:17px;font-weight:700;letter-spacing:-.015em;}
.consigna{margin-top:var(--s2);font-size:14.5px;color:var(--ink-2);max-width:62ch;}
.consigna strong{color:var(--ink);font-weight:650;}
.bloque-act{margin-top:var(--s6);}
.lienzo{margin-top:var(--s5);}

/* ============================================================
   BOTONES
   ============================================================ */
.btn{
  font-family:inherit;font-size:14.5px;font-weight:650;cursor:pointer;letter-spacing:-.005em;
  border:1px solid transparent;border-radius:var(--r1);padding:11px 17px;
  background:#fff;color:var(--ink);box-shadow:var(--e1);
  display:inline-flex;align-items:center;gap:var(--s2);text-decoration:none;
  transition:background .18s var(--ease), border-color .18s var(--ease),
             box-shadow .18s var(--ease), transform .18s var(--ease), color .18s var(--ease);
}
.btn .svg-ico{font-size:16px;}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--e2);}
.btn:active:not(:disabled){transform:translateY(0);box-shadow:var(--e0);}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none;}
.btn-1{background:var(--leaf);color:#fff;box-shadow:0 1px 2px rgba(19,36,29,.14);}
.btn-1:hover:not(:disabled){background:var(--leaf-d);}
.btn-2{border-color:var(--line);color:var(--ink-2);}
.btn-2:hover:not(:disabled){border-color:var(--ink-4);color:var(--ink);}
.btn-sol{background:var(--sun);color:#3A2704;box-shadow:0 1px 2px rgba(19,36,29,.14);}
.btn-sol:hover:not(:disabled){background:var(--sun-d);color:#fff;}
.btn-cta{background:var(--leaf);color:#fff;font-size:15.5px;padding:13px 22px;box-shadow:0 2px 4px rgba(19,36,29,.16);}
.btn-cta:hover:not(:disabled){background:var(--leaf-d);}
.fila{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s6);align-items:center;}

/* ============================================================
   FEEDBACK
   ============================================================ */
.fb{
  display:none;margin-top:var(--s5);padding:var(--s4);border-radius:var(--r2);
  gap:var(--s3);align-items:flex-start;border:1px solid transparent;
}
.fb.on{display:flex;animation:entra .26s var(--ease);}
@keyframes entra{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.fb .ic{font-size:19px;line-height:1;margin-top:1px;flex:none;}
.fb .tit{font-weight:700;font-size:14.5px;letter-spacing:-.012em;}
.fb .txt{font-size:14px;color:var(--ink-2);margin-top:2px;}
.fb .pista{
  margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid rgba(19,36,29,.09);
  font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
}
.fb-ok{background:var(--leaf-ll);border-color:rgba(47,138,91,.22);}
.fb-ok .ic,.fb-ok .tit{color:var(--leaf-d);}
.fb-casi{background:var(--sun-l);border-color:rgba(229,162,31,.3);}
.fb-casi .ic,.fb-casi .tit{color:var(--sun-d);}
.fb-info{background:#fff;border-color:var(--line);}
.fb-info .ic,.fb-info .tit{color:var(--ink-3);}

.pasos{display:flex;gap:var(--s1);align-items:center;margin-top:var(--s5);flex-wrap:wrap;}
.pasos i{width:22px;height:3px;border-radius:99px;background:var(--line);transition:background .3s var(--ease);}
.pasos i.hecho{background:var(--leaf);}
.pasos i.actual{background:var(--sun);}
.pasos .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-4);margin-left:var(--s2);font-variant-numeric:tabular-nums;}

/* ============================================================
   VITRINA
   ============================================================ */
.vitrina{
  border-radius:var(--r2);height:158px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#EDF5F2 0%,#E4F0E9 62%,#D5E7DB 62%,#CFE3D5 100%);
  box-shadow:inset 0 0 0 1px rgba(19,36,29,.05);
}
.vitrina .pieza{font-size:60px;line-height:1;filter:drop-shadow(0 8px 8px rgba(19,36,29,.14));}
.vitrina .pieza.entra{animation:brinco .55s var(--ease);}
@keyframes brinco{
  0%{transform:translateY(8px) scale(.82);opacity:0;}
  55%{transform:translateY(-9px) scale(1.04);opacity:1;}
  100%{transform:none;opacity:1;}
}

.tarjetas{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4);}
.tarjeta-op{
  text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:var(--r2);
  padding:var(--s4);box-shadow:var(--e0);display:flex;gap:var(--s3);align-items:flex-start;
  transition:border-color .18s var(--ease), box-shadow .18s var(--ease), transform .18s var(--ease), background .18s var(--ease);
}
.tarjeta-op:hover:not(:disabled){border-color:var(--leaf);box-shadow:var(--e2);transform:translateY(-1px);}
.tarjeta-op:disabled{cursor:default;}
.tarjeta-op .mini{font-size:19px;color:var(--ink-3);margin-top:1px;flex:none;transition:color .18s var(--ease);}
.tarjeta-op:hover:not(:disabled) .mini{color:var(--leaf);}
.tarjeta-op .t{font-weight:700;font-size:14.5px;letter-spacing:-.012em;display:block;}
.tarjeta-op .d{font-size:12.5px;color:var(--ink-3);line-height:1.42;margin-top:2px;display:block;}
.tarjeta-op.acierto{border-color:var(--leaf);background:var(--leaf-ll);}
.tarjeta-op.acierto .mini{color:var(--leaf);}
.tarjeta-op.fallo{border-color:var(--sun);background:var(--sun-l);}
.tarjeta-op.fallo .mini{color:var(--sun-d);}
.tarjeta-op.opaca{opacity:.4;}

/* ============================================================
   PREGUNTAS
   ============================================================ */
.pregunta{font-size:18.5px;font-weight:700;letter-spacing:-.02em;line-height:1.35;margin-top:var(--s5);max-width:56ch;}
.opciones{display:grid;gap:var(--s2);margin-top:var(--s4);}
.op{
  text-align:left;cursor:pointer;font-family:inherit;font-size:14.5px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:var(--r1);
  padding:13px 15px;box-shadow:var(--e0);display:flex;align-items:center;gap:var(--s3);
  transition:border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
}
.op:hover:not(:disabled){border-color:var(--leaf);box-shadow:var(--e2);}
.op .marca{
  width:18px;height:18px;flex:none;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;
  transition:background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease);
}
.op:hover:not(:disabled) .marca{border-color:var(--ink-4);}
.op.acierto{border-color:var(--leaf);background:var(--leaf-ll);}
.op.acierto .marca{background:var(--leaf);border-color:var(--leaf);color:#fff;}
.op.fallo{border-color:var(--sun);background:var(--sun-l);}
.op.fallo .marca{background:var(--sun);border-color:var(--sun);color:#fff;}
.op.opaca{opacity:.42;}

.jardin{
  display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-top:var(--s4);
  padding:var(--s6) var(--s4) var(--s5);border-radius:var(--r2);
  background:linear-gradient(180deg,#EAF3EC 0%,#DCEBE1 66%,#C2A883 66%,#B49874 100%);
  box-shadow:inset 0 0 0 1px rgba(19,36,29,.05);
}
.flor{
  background:none;border:0;padding:0;cursor:pointer;display:flex;justify-content:center;
  transition:transform .2s var(--ease);
}
.flor:hover:not(:disabled){transform:translateY(-4px);}
.flor:focus-visible{border-radius:var(--r1);}
.flor svg{width:100%;max-width:92px;height:auto;overflow:visible;}
.flor .petalos{transform-origin:50% 74%;transition:transform .22s var(--ease);}
.flor:hover:not(:disabled) .petalos{transform:rotate(-5deg);}
.flor.buena .petalos{animation:florece .5s var(--ease) forwards;}
@keyframes florece{0%{transform:scale(1);}50%{transform:scale(1.13) rotate(5deg);}100%{transform:scale(1.05);}}
.flor.mala{opacity:.5;}

/* ============================================================
   CANTERO
   ============================================================ */
.cantero-wrap{border-radius:var(--r2);overflow:hidden;box-shadow:var(--e2);margin-top:var(--s4);}
.cantero{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;padding:var(--s3);background:var(--soil);}
.hueco{
  aspect-ratio:1/1;border:0;cursor:pointer;border-radius:8px;padding:0;background:#E5D8C0;
  box-shadow:inset 0 1.5px 3px rgba(84,58,28,.24);
  display:flex;align-items:center;justify-content:center;
  transition:background .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease);
}
.hueco:hover:not(:disabled){background:#F0E6D3;transform:translateY(-1px);}
.hueco svg{width:76%;height:76%;overflow:visible;}
.hueco.puesta{background:#DCEBE0;box-shadow:inset 0 1.5px 3px rgba(26,83,53,.18);}
.hueco.puesta svg{animation:planta .42s var(--ease);}
@keyframes planta{0%{transform:translateY(7px) scale(.5);opacity:0;}62%{transform:translateY(-2px) scale(1.07);opacity:1;}100%{transform:none;opacity:1;}}
.hueco.resaltada{box-shadow:inset 0 0 0 2px var(--sun);}
.reglita{
  display:grid;grid-template-columns:repeat(12,1fr);gap:5px;padding:0 var(--s3) var(--s3);
  background:var(--soil-d);font-family:var(--mono);font-size:10.5px;
  color:rgba(255,255,255,.72);text-align:center;padding-top:var(--s2);
  font-variant-numeric:tabular-nums;
}
.distancias{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4);}
.dist{
  font-family:var(--mono);font-size:12px;border-radius:99px;padding:4px 11px;
  display:inline-flex;align-items:center;gap:var(--s2);font-variant-numeric:tabular-nums;
}
.dist strong{font-weight:600;}
.dist.igual{background:var(--leaf-l);color:var(--leaf-dd);}
.dist.difiere{background:var(--sun-l);color:var(--sun-d);box-shadow:inset 0 0 0 1px rgba(229,162,31,.45);}
.contador{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin-top:var(--s3);}

/* ============================================================
   BLOQUES
   ============================================================ */
.taller{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4);}
.panel{
  background:#fff;border:1px solid var(--line);border-radius:var(--r2);
  padding:var(--s4);box-shadow:var(--e0);min-height:216px;
}
.panel.destino{background:var(--leaf-ll);border-style:dashed;border-color:rgba(47,138,91,.32);box-shadow:none;}
.panel h4{
  font-size:12px;font-weight:650;color:var(--ink-3);margin:0 0 var(--s3);
  display:flex;align-items:center;gap:var(--s2);
}
.panel h4 .svg-ico{font-size:14px;}
.pila{display:grid;gap:var(--s2);}
.bloque{
  position:relative;text-align:left;font-family:inherit;font-size:13px;font-weight:650;color:#fff;
  border:0;border-radius:9px;padding:11px 12px 11px 36px;cursor:pointer;width:100%;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.16);letter-spacing:-.008em;line-height:1.35;
  transition:filter .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease);
}
.bloque .cat-ic{
  position:absolute;left:11px;top:11.5px;font-size:15px;opacity:.9;
}
.bloque:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.07);box-shadow:inset 0 -2px 0 rgba(0,0,0,.16), var(--e2);}
.bloque.puesto{cursor:default;animation:encastra .32s var(--ease);}
@keyframes encastra{0%{transform:translateY(-6px);opacity:0;}100%{transform:none;opacity:1;}}
.bloque.sangria{margin-left:16px;}
.b-evento{background:var(--c-evento);}
.b-movimiento{background:var(--c-movimiento);}
.b-control{background:var(--c-control);}
.b-apariencia{background:var(--c-apariencia);}
.b-lapiz{background:var(--c-lapiz);}
.vacio{font-size:13px;color:var(--ink-4);text-align:center;padding:var(--s7) var(--s2);line-height:1.5;}
.pill-cat{
  display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;
  font-size:12px;font-weight:650;color:#fff;
}
.pill-cat .svg-ico{font-size:13px;}

/* ============================================================
   PAREJAS
   ============================================================ */
.parejas{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4);}
.parejas .col{display:grid;gap:var(--s2);align-content:start;}
.parejas .cab{font-size:12px;font-weight:650;color:var(--ink-3);padding-left:2px;}
.par-btn{
  text-align:left;font-family:inherit;font-size:14px;cursor:pointer;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:var(--r1);
  padding:11px 13px;box-shadow:var(--e0);display:flex;align-items:center;gap:var(--s2);
  transition:border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
}
.par-btn:hover:not(:disabled){border-color:var(--ink-4);box-shadow:var(--e2);}
.par-btn.concepto{font-weight:700;}
.par-btn.elegido{border-color:var(--petal);background:var(--petal-l);}
.par-btn.elegido .pin{color:var(--petal);}
.par-btn.unido{background:var(--leaf-ll);border-color:rgba(47,138,91,.35);color:var(--leaf-dd);cursor:default;box-shadow:none;}
.par-btn.unido .pin{color:var(--leaf);}
.par-btn .pin{font-size:15px;flex:none;color:var(--ink-4);display:flex;transition:color .18s var(--ease);}

/* ============================================================
   CANDADO
   ============================================================ */
.candado{text-align:center;max-width:420px;margin:var(--s3) auto var(--s2);}
.candado .escena-rana{width:138px;height:auto;margin:0 auto var(--s4);display:block;}
.candado h2{font-size:22px;}
.candado p.exp{font-size:14.5px;color:var(--ink-2);margin:var(--s2) auto var(--s6);max-width:36ch;}
.letras{display:flex;justify-content:center;gap:6px;margin-bottom:var(--s4);}
.letras i{width:22px;height:2px;border-radius:99px;background:var(--ink-4);opacity:.5;}
.candado input{
  font-family:var(--mono);font-size:19px;text-align:center;letter-spacing:.2em;font-weight:500;
  border:1px solid var(--line);border-radius:var(--r1);padding:13px 16px;
  width:260px;max-width:100%;background:#fff;color:var(--ink);box-shadow:var(--e1);
  transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
}
.candado input::placeholder{color:var(--ink-4);letter-spacing:.3em;}
.candado input.error{border-color:var(--sun);animation:tiembla .32s var(--ease);}
@keyframes tiembla{0%,100%{transform:translateX(0);}22%{transform:translateX(-6px);}66%{transform:translateX(6px);}}
.candado .fila{justify-content:center;margin-top:var(--s4);}
.candado .fb{text-align:left;}

/* ============================================================
   CIERRE
   ============================================================ */
.cierre{max-width:520px;margin:0 auto;}
.cierre .sello{
  width:52px;height:52px;border-radius:50%;background:var(--leaf);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  animation:sello .45s var(--ease);
}
@keyframes sello{0%{transform:scale(.5);opacity:0;}100%{transform:none;opacity:1;}}
.cierre h2{font-size:23px;margin-top:var(--s4);}
.cierre .sub{color:var(--ink-3);font-size:14.5px;margin-top:var(--s1);}
.stats{display:flex;gap:var(--s7);margin:var(--s6) 0;padding:var(--s4) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:600;color:var(--leaf-d);font-variant-numeric:tabular-nums;letter-spacing:-.03em;}
.stat .l{font-size:12.5px;color:var(--ink-3);margin-top:1px;}
.aprendido{display:flex;gap:var(--s3);margin-bottom:var(--s5);}
.aprendido .ic{font-size:19px;color:var(--sun-d);flex:none;margin-top:2px;}
.aprendido .t{font-size:12.5px;font-weight:650;color:var(--ink-3);}
.aprendido .d{font-size:14.5px;color:var(--ink);margin-top:2px;}

.meta-card .t{font-size:12.5px;font-weight:650;color:var(--ink-3);margin-bottom:var(--s3);}
.meta-card ul{margin:0;padding:0;list-style:none;display:grid;gap:var(--s3);}
.meta-card li{
  font-size:14.5px;color:var(--ink-2);padding-left:var(--s4);position:relative;line-height:1.45;
}
.meta-card li::before{
  content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--petal);
}
.cierre .fila{justify-content:flex-start;}

/* ============================================================
   MODAL
   ============================================================ */
.telon{
  position:fixed;inset:0;background:rgba(13,28,22,.5);
  display:flex;align-items:center;justify-content:center;padding:var(--s5);z-index:80;
  animation:fade .22s var(--ease);
}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal{
  background:var(--paper);border-radius:var(--r3);box-shadow:var(--e3);
  max-width:432px;width:100%;padding:var(--s7) var(--s6) var(--s6);text-align:center;
  animation:sube-modal .3s var(--ease);
}
@keyframes sube-modal{from{transform:translateY(14px) scale(.98);opacity:0;}to{transform:none;opacity:1;}}
.modal .rana-svg{width:92px;height:auto;margin:0 auto var(--s4);display:block;}
.modal h2{font-size:22px;}
.modal p{font-size:14.5px;color:var(--ink-2);margin-top:var(--s2);}
.modal .puntos-mini{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;
  color:var(--sun-d);margin-top:var(--s4);font-variant-numeric:tabular-nums;
}
.modal .fila{justify-content:center;margin-top:var(--s5);}
.modal .nota{font-size:12.5px;color:var(--ink-4);margin-top:var(--s4);}

.particula{position:fixed;width:7px;height:7px;pointer-events:none;z-index:90;}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:840px){
  .taller,.parejas,.tarjetas{grid-template-columns:1fr;}
  .panel{min-height:0;}
}
@media (max-width:620px){
  .app{padding:var(--s4) var(--s3) var(--s8);}
  .hoja{padding:var(--s6) var(--s5) var(--s6) var(--s8);}
  .hoja::after{left:30px;}
  .espiral{left:12px;}
  .hero-bar{padding:var(--s4) var(--s5);gap:var(--s3);}
  .marcador{min-width:100%;}
  .jardin{grid-template-columns:repeat(2,1fr);}
  .cantero,.reglita{grid-template-columns:repeat(6,1fr);}
  .pregunta{font-size:17px;}
  .stats{gap:var(--s6);}
  .etapa-card{width:150px;}
}
@media (max-height:760px){
  #escena{max-height:150px;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;

  }
}
@media (prefers-reduced-motion:no-preference){

  @keyframes mece{0%,100%{transform:rotate(-1.6deg);}50%{transform:rotate(1.6deg);}}
  #rana-hero{animation:respira 4s ease-in-out infinite;}
  @keyframes respira{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}

  var URL_SCRATCH = "https://scratch.mit.edu/projects/editor";
  var puntos = 0, etapaActiva = 0;
  var abiertas = [], progreso = [], cartelVisto = [], puntosEtapa = [];
  for(var z=0; z<ETAPAS.length; z++){ abiertas.push(false); progreso.push(0); cartelVisto.push(false); puntosEtapa.push(0); }

  var MAX_PUNTOS = (function(){
    var t = 0;
    for(var i=0;i<ETAPAS.length;i++){
      var acts = ETAPAS[i].actividades;
      for(var j=0;j<acts.length;j++){
        var a = acts[j];
        if(a.tipo === "quiz"){ t += a.preguntas.length * 10; }
        if(a.tipo === "cantero"){ t += 20; }
        if(a.tipo === "secuencia"){ t += 30; }
        if(a.tipo === "parejas"){ t += a.pares.length * 10; }
      }
    }
    return t;
  })();

  var elPuntos   = document.getElementById("puntos");
  var elRelleno  = document.getElementById("relleno");
  var elMarcador = document.getElementById("marcador");

  var elEscena   = document.getElementById("escena");

  /* ============================================================
     UTILIDADES
     ============================================================ */
  function el(tag, clase, texto){
    var e = document.createElement(tag);
    if(clase){ e.className = clase; }
    if(texto !== undefined && texto !== null){ e.textContent = texto; }
    return e;
  }
  function html(tag, clase, markup){
    var e = document.createElement(tag);
    if(clase){ e.className = clase; }
    if(markup !== undefined){ e.innerHTML = markup; }
    return e;
  }
  function mezclar(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function norm(s){
    s = String(s).toLowerCase().replace(/^\s+|\s+$/g,"");
    if(s.normalize){ s = s.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
    return s;
  }
  function reduceMotion(){
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function sumar(n, origen){
    puntos += n;
    puntosEtapa[etapaActiva] += n;
    elPuntos.textContent = puntos;
    elRelleno.style.width = Math.min(100, (puntos/MAX_PUNTOS)*100) + "%";
    elMarcador.className = "marcador";
    void elMarcador.offsetWidth;
    elMarcador.className = "marcador pulso";
    if(!reduceMotion()){
      var chip = el("div","chip-suma","+" + n);
      var r = origen && origen.getBoundingClientRect ? origen.getBoundingClientRect() : elMarcador.getBoundingClientRect();
      chip.style.left = (r.left + r.width/2 - 12) + "px";
      chip.style.top  = (r.top - 4) + "px";
      document.body.appendChild(chip);
      setTimeout(function(){ if(chip.parentNode){ chip.parentNode.removeChild(chip); } }, 950);
    }
    pintarHero();
  }

  function celebrar(x, y){
    if(reduceMotion()){ return; }
    var cols = ["#2F8A5B","#E5A21F","#8FCFA4","#C9527A"];
    for(var i=0;i<10;i++){
      (function(i){
        var p = el("div","particula");
        p.style.background = cols[i % cols.length];
        p.style.left = x + "px";
        p.style.top = y + "px";
        p.style.borderRadius = (i % 2 ? "50%" : "2px");
        document.body.appendChild(p);
        var ang = (Math.PI*2)*(i/10) + Math.random()*0.5;
        var dist = 52 + Math.random()*62;
        p.animate([
          {transform:"translate(0,0) scale(1)", opacity:1},
          {transform:"translate("+(Math.cos(ang)*dist)+"px,"+(Math.sin(ang)*dist-26)+"px) rotate(180deg) scale(.4)", opacity:0}
        ], {duration:640 + Math.random()*260, easing:"cubic-bezier(.22,.7,.25,1)"});
        setTimeout(function(){ if(p.parentNode){ p.parentNode.removeChild(p); } }, 950);
      })(i);
    }
  }

  /* ============================================================
     HERO
     ============================================================ */
  function pintarHero(){
    var W = 800, H = 196, base = 146;
    var x0 = 64, paso = (W - 128) / (ETAPAS.length - 1);
    var s = [];

    s.push('<defs>');
    s.push('<linearGradient id="gCielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9F3F1"/><stop offset="1" stop-color="#F3F8F2"/></linearGradient>');
    s.push('<linearGradient id="gPasto" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6E2CD"/><stop offset="1" stop-color="#A9D2B5"/></linearGradient>');
    s.push('</defs>');

    s.push('<rect width="'+W+'" height="'+H+'" fill="url(#gCielo)"/>');
    s.push('<circle cx="712" cy="40" r="19" fill="#E5A21F" opacity=".22"/>');
    s.push('<path d="M-20 '+(base-16)+' q 130 -46 260 -12 q 130 34 250 -10 q 120 -38 330 8 L820 '+H+' L-20 '+H+' Z" fill="#D6E9DA"/>');
    s.push('<path d="M-20 '+(base+2)+' q 170 -32 340 -4 q 150 24 300 -8 q 110 -22 220 6 L820 '+H+' L-20 '+H+' Z" fill="url(#gPasto)"/>');
    s.push('<rect x="0" y="'+(base+26)+'" width="'+W+'" height="'+(H-base-26)+'" fill="#B08050"/>');
    s.push('<line x1="40" y1="'+(base+26)+'" x2="760" y2="'+(base+26)+'" stroke="#7A9A83" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>');

    for(var i=0;i<ETAPAS.length;i++){
      var x = x0 + paso*i;
      var completa = abiertas[i] && progreso[i] >= ETAPAS[i].actividades.length;
      s.push('<line x1="'+x+'" y1="'+(base+20)+'" x2="'+x+'" y2="'+(base+32)+'" stroke="#6D8E77" stroke-width="1.6" opacity=".5"/>');
      s.push('<text x="'+x+'" y="'+(base+44)+'" font-size="10" font-family="ui-monospace,monospace" fill="rgba(255,255,255,.72)" text-anchor="middle">'+ETAPAS[i].n+'</text>');

      var g = '<g class="flor-hero" style="animation-delay:'+(i*0.5)+'s" transform="translate('+x+','+(base+20)+')">';
      if(completa){
        var tono = ["#E5A21F","#C9527A","#DD8543","#A868B8"][i % 4];
        g += '<path d="M0 0 L0 -28" stroke="#3F8A5C" stroke-width="2.4" stroke-linecap="round"/>';
        g += '<path d="M0 -13 q -12 -3 -14 -12 q 11 -2 14 12z" fill="#59A87C"/>';
        g += '<g transform="translate(0,-32)">';
        for(var p=0;p<5;p++){
          var a = (p/5)*Math.PI*2;
          var cx = (Math.cos(a)*7.2).toFixed(1), cy = (Math.sin(a)*7.2).toFixed(1);
          g += '<ellipse cx="'+cx+'" cy="'+cy+'" rx="5.8" ry="4.2" fill="'+tono+'" transform="rotate('+((a*180/Math.PI)+90).toFixed(1)+' '+cx+' '+cy+')"/>';
        }
        g += '<circle r="3.8" fill="#FCFAF4"/></g>';
      }else if(abiertas[i]){
        g += '<path d="M0 0 L0 -19" stroke="#59A87C" stroke-width="2.4" stroke-linecap="round"/>';
        g += '<ellipse cx="0" cy="-23" rx="5" ry="7" fill="#93C9A7"/>';
        g += '<path d="M0 -9 q -10 -2 -12 -10 q 9 -2 12 10z" fill="#73B893"/>';
      }else{
        g += '<path d="M0 0 L0 -10" stroke="#8FB29B" stroke-width="2" stroke-linecap="round"/>';
        g += '<path d="M0 -6 q -8 -2 -9 -8 q 7 -1 9 8z" fill="#A6C7B1"/>';
        g += '<path d="M0 -6 q 8 -2 9 -8 q -7 -1 -9 8z" fill="#A6C7B1" opacity=".7"/>';
      }
      g += '</g>';
      s.push(g);
    }

    var rx = x0 + paso*etapaActiva;
    s.push('<g style="transform:translate('+rx+'px,'+(base+17)+'px);transition:transform .75s cubic-bezier(.34,1.25,.5,1)">');
    s.push('<ellipse cx="0" cy="3" rx="17" ry="4" fill="#1A5335" opacity=".16"/>');
    s.push('<g id="rana-hero">');
    s.push('<ellipse cx="-12" cy="-6" rx="7.4" ry="4.6" fill="#246E48"/><ellipse cx="12" cy="-6" rx="7.4" ry="4.6" fill="#246E48"/>');
    s.push('<ellipse cx="0" cy="-12" rx="15.6" ry="11" fill="#2F8A5B"/>');
    s.push('<ellipse cx="0" cy="-8" rx="10" ry="6" fill="#8FCFA4" opacity=".5"/>');
    s.push('<circle cx="-6.4" cy="-22" r="5.8" fill="#2F8A5B"/><circle cx="6.4" cy="-22" r="5.8" fill="#2F8A5B"/>');
    s.push('<circle cx="-6.4" cy="-23" r="3.6" fill="#FCFAF4"/><circle cx="6.4" cy="-23" r="3.6" fill="#FCFAF4"/>');
    s.push('<circle cx="-5.6" cy="-23" r="1.8" fill="#13241D"/><circle cx="7.2" cy="-23" r="1.8" fill="#13241D"/>');
    s.push('<path d="M-4.5 -11 q 4.5 3.6 9 0" stroke="#1A5335" stroke-width="1.8" fill="none" stroke-linecap="round"/>');
    s.push('</g></g>');

    elEscena.innerHTML = s.join("");
  }

  /* ============================================================
     CAMINO
     ============================================================ */
  function pintarRail(){
    elRail.innerHTML = "";
    for(var i=0;i<ETAPAS.length;i++){
      (function(i){
        var e = ETAPAS[i];
        var completa = abiertas[i] && progreso[i] >= e.actividades.length;
        var card = el("button","etapa-card" + (abiertas[i] ? "" : " bloqueada") + (completa ? " completa" : "") + (i===etapaActiva ? " activa" : ""));
        card.setAttribute("aria-current", i===etapaActiva ? "true" : "false");

        var f1 = el("div","fila1");
        f1.appendChild(el("span","badge","0" + e.n));
        f1.appendChild(html("span","estado", abiertas[i] ? (completa ? ICO.tilde : ICO.circulo) : ICO.candado));
        card.appendChild(f1);

        card.appendChild(el("div","nom", abiertas[i] ? e.titulo : "Etapa bloqueada"));

        var dots = el("div","dots");
        for(var k=0;k<e.actividades.length;k++){
          dots.appendChild(el("i", (abiertas[i] && progreso[i] > k) ? "on" : ""));
        }
        card.appendChild(dots);

        card.addEventListener("click", function(){ etapaActiva = i; render(); });
        elRail.appendChild(card);
      })(i);
    }
  }

  /* ============================================================
     COMPARTIDOS
     ============================================================ */
  function feedback(tipo, titulo, texto, pistaHTML){
    var d = el("div", "fb fb-" + tipo + " on");
    d.appendChild(html("span","ic", tipo === "ok" ? ICO.tilde : (tipo === "casi" ? ICO.lampara : ICO.circulo)));
    var c = el("div");
    c.appendChild(el("div","tit", titulo));
    c.appendChild(el("div","txt", texto));
    if(pistaHTML){ c.appendChild(html("div","pista", pistaHTML)); }
    d.appendChild(c);
    return d;
  }
  function pasos(total, actual){
    var d = el("div","pasos");
    for(var k=0;k<total;k++){
      d.appendChild(el("i", k<actual ? "hecho" : (k===actual ? "actual" : "")));
    }
    d.appendChild(el("span","n",(actual<total ? actual+1 : total) + " / " + total));
    return d;
  }
  function botonSiguiente(host, texto){
    var f = el("div","fila");
    var b = html("button","btn btn-1", texto + ICO.flecha);
    b.addEventListener("click", terminarActividad);
    f.appendChild(b);
    host.appendChild(f);
    b.focus();
  }

  /* ============================================================
     RENDER
     ============================================================ */
  function render(){
    pintarRail();
    pintarHero();
    elCont.innerHTML = "";
    var hoja = el("section","hoja");
    var esp = el("div","espiral");
    for(var s=0;s<8;s++){ esp.appendChild(el("i")); }
    hoja.appendChild(esp);
    elCont.appendChild(hoja);

    var e = ETAPAS[etapaActiva];
    if(!abiertas[etapaActiva]){ renderCandado(hoja, e); return; }

    var enc = el("div","enc");
    enc.appendChild(el("p","eyebrow","Etapa " + e.n + " · " + e.sub));
    enc.appendChild(el("h2",null,e.titulo));
    hoja.appendChild(enc);

    if(progreso[etapaActiva] >= e.actividades.length){
      renderCierre(hoja, e);
      if(!cartelVisto[etapaActiva]){
        cartelVisto[etapaActiva] = true;
        setTimeout(function(){ mostrarCartel(e); }, 460);
      }
      return;
    }

    var act = e.actividades[progreso[etapaActiva]];
    var cab = el("div","bloque-act");
    cab.appendChild(el("h3","titulo-act", act.titulo));
    cab.appendChild(html("p","consigna", act.consigna));
    hoja.appendChild(cab);

  /* ============================================================
     QUIZ
     ============================================================ */
  function juegoQuiz(host, act){
    var lista = mezclar(act.preguntas), i = 0, pieza = null;

    if(act.render === "vitrina"){
      var v = el("div","vitrina");
      pieza = el("span","pieza","🐸");
      v.appendChild(pieza);
      host.appendChild(v);
    }

    var preg = el("p","pregunta");
    host.appendChild(preg);

    var cont = el("div", act.render === "flores" ? "jardin" : (act.render === "vitrina" ? "tarjetas" : "opciones"));
    host.appendChild(cont);

    var zonaFB = el("div"); host.appendChild(zonaFB);
    var zonaPasos = el("div"); host.appendChild(zonaPasos);
    var pie = el("div"); host.appendChild(pie);

    function florSVG(num, tono){
      var petalos = '';
      for(var p=0;p<6;p++){
        var a = (p/6)*Math.PI*2;
        var cx = (Math.cos(a)*16).toFixed(1), cy = (Math.sin(a)*16).toFixed(1);
        petalos += '<ellipse cx="'+cx+'" cy="'+cy+'" rx="12" ry="8.6" fill="'+tono+'" transform="rotate('+((a*180/Math.PI)+90).toFixed(1)+' '+cx+' '+cy+')"/>';
      }
      return '<svg viewBox="-38 -44 76 88" aria-hidden="true">' +
        '<path d="M0 44 L0 -2" stroke="#3F8A5C" stroke-width="4" stroke-linecap="round"/>' +
        '<path d="M0 23 q -16 -4 -19 -16 q 15 -3 19 16z" fill="#59A87C"/>' +
        '<g class="petalos">' + petalos +
        '<circle r="12.6" fill="#FCFAF4"/>' +
        '<text y="5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#13241D">'+num+'</text>' +
        '</g></svg>';
    }

    function pintar(){
      var q = lista[i];
      if(pieza){
        pieza.textContent = q.emoji || "🐸";
        pieza.className = "pieza";
        void pieza.offsetWidth;
        pieza.className = "pieza entra";
      }
      preg.textContent = q.p;
      cont.innerHTML = "";
      zonaFB.innerHTML = "";
      pie.innerHTML = "";
      var tonos = ["#E5A21F","#C9527A","#DD8543","#A868B8"];

      for(var k=0;k<q.o.length;k++){
        (function(k){
          var b;
          if(act.render === "flores"){
            b = html("button","flor", florSVG(q.o[k], tonos[k % tonos.length]));
            b.setAttribute("aria-label","Flor con el número " + q.o[k]);
          }else if(act.render === "vitrina"){
            var esObjeto = (k === 0);
            b = html("button","tarjeta-op",
              '<span class="mini">' + (esObjeto ? ICO.mover : ICO.cuadricula) + '</span>' +
              '<span><span class="t">' + q.o[k] + '</span>' +
              '<span class="d">' + (esObjeto ? "Se programa aparte y puede moverse" : "Ocupa toda la pantalla, atrás de todo") + '</span></span>');
          }else{
            b = html("button","op", '<span class="marca">' + ICO.tilde + '</span><span>' + q.o[k] + '</span>');
          }
          b.addEventListener("click", function(){ responder(k, b); });
          cont.appendChild(b);
        })(k);
      }
      zonaPasos.innerHTML = "";
      zonaPasos.appendChild(pasos(lista.length, i));
    }

    function marcar(nodo, clase, claseFlor){
      if(!nodo){ return; }
      nodo.className += " " + (act.render === "flores" ? claseFlor : clase);
    }

    function responder(k, boton){
      var q = lista[i], bs = cont.children;
      for(var j=0;j<bs.length;j++){ bs[j].disabled = true; }

      if(k === q.c){
        sumar(10, boton);
        marcar(boton,"acierto","buena");
        zonaFB.appendChild(feedback("ok","¡Muy bien!", q.r, null));
      }else{
        marcar(boton,"fallo","mala");
        marcar(bs[q.c],"acierto","buena");
        for(var m=0;m<bs.length;m++){
          if(m !== k && m !== q.c){ bs[m].className += " opaca"; }
        }
        zonaFB.appendChild(feedback("casi","Casi…", q.r, "La respuesta era: " + q.o[q.c]));
      }

      i++;
      zonaPasos.innerHTML = "";
      zonaPasos.appendChild(pasos(lista.length, i));

      var f = el("div","fila");
      var b = html("button","btn btn-1", (i < lista.length ? "Siguiente pregunta" : "Terminar actividad") + ICO.flecha);
      b.addEventListener("click", i < lista.length ? pintar : terminarActividad);
      f.appendChild(b);
      pie.appendChild(f);
      b.focus();
    }

    pintar();
  }

  function juegoCantero(host){
    var TOTAL = 12;
    var pedidas = 3 + Math.floor(Math.random()*2);
    var sel = [], celdas = [];

    host.appendChild(html("p","consigna",
      "Plantá <strong>" + pedidas + " macetas</strong> en el cantero. Tocá un casillero para poner o sacar una."));

    var wrap = el("div","cantero-wrap");
    var cantero = el("div","cantero");
    var reglita = el("div","reglita");
    wrap.appendChild(cantero); wrap.appendChild(reglita);
    host.appendChild(wrap);

    var contador = el("p","contador"); host.appendChild(contador);
    var zonaDist = el("div"); host.appendChild(zonaDist);

    var fila = el("div","fila");
    var bRev = html("button","btn btn-1", ICO.tilde + "Revisar el cantero");
    var bLim = html("button","btn btn-2", "Sacar todas");
    fila.appendChild(bRev); fila.appendChild(bLim);
    host.appendChild(fila);

    var zonaFB = el("div"); host.appendChild(zonaFB);
    var pie = el("div"); host.appendChild(pie);

    var MACETA = '<svg viewBox="0 0 40 40" aria-hidden="true">' +
      '<path d="M20 22V12.5" stroke="#3F8A5C" stroke-width="2.4" stroke-linecap="round"/>' +
      '<circle cx="20" cy="8.6" r="3.2" fill="#FBF0D8"/>' +
      '<ellipse cx="20" cy="4.2" rx="3.1" ry="2.4" fill="#E5A21F"/><ellipse cx="20" cy="13" rx="3.1" ry="2.4" fill="#E5A21F"/>' +
      '<ellipse cx="15.6" cy="8.6" rx="2.4" ry="3.1" fill="#E5A21F"/><ellipse cx="24.4" cy="8.6" rx="2.4" ry="3.1" fill="#E5A21F"/>' +
      '<path d="M11.6 23.4h16.8l-1.9 11.2a1.8 1.8 0 0 1-1.8 1.5H15.3a1.8 1.8 0 0 1-1.8-1.5z" fill="#B96F41"/>' +
      '<rect x="10.2" y="21" width="19.6" height="4.2" rx="2.1" fill="#CC7F4C"/></svg>';

    function actualizar(){ contador.textContent = "Macetas plantadas: " + sel.length + " de " + pedidas; }
    function limpiarResaltado(){
      for(var q=0;q<celdas.length;q++){ celdas[q].className = celdas[q].className.replace(" resaltada",""); }
    }

    for(var i=0;i<TOTAL;i++){
      (function(pos){
        var b = el("button","hueco");
        b.setAttribute("aria-label","Casillero " + pos);
        celdas.push(b);
        b.addEventListener("click", function(){
          zonaFB.innerHTML = ""; zonaDist.innerHTML = "";
          limpiarResaltado();
          var idx = sel.indexOf(pos);
          if(idx >= 0){
            sel.splice(idx,1); b.className = "hueco"; b.innerHTML = "";
          }else{
            if(sel.length >= pedidas){
              zonaFB.appendChild(feedback("info","Ya están todas",
                "Hay " + pedidas + " macetas plantadas. Sacá una si querés cambiarla de lugar.", null));
              return;
            }
            sel.push(pos); b.className = "hueco puesta"; b.innerHTML = MACETA;
          }
          actualizar();
        });
        cantero.appendChild(b);
        reglita.appendChild(el("span",null,String(pos)));
      })(i);
    }
    actualizar();

    bLim.addEventListener("click", function(){
      sel = [];
      for(var j=0;j<celdas.length;j++){ celdas[j].className = "hueco"; celdas[j].innerHTML = ""; }
      zonaFB.innerHTML = ""; zonaDist.innerHTML = ""; pie.innerHTML = "";
      actualizar();
    });

    bRev.addEventListener("click", function(){
      zonaFB.innerHTML = ""; zonaDist.innerHTML = "";
      limpiarResaltado();
      if(sel.length !== pedidas){
        zonaFB.appendChild(feedback("info","Faltan macetas",
          "Necesitás plantar exactamente " + pedidas + " para poder revisar el cantero.", null));
        return;
      }
      var orden = sel.slice().sort(function(a,b){ return a-b; });
      var paso = orden[1]-orden[0], iguales = true, gaps = [];
      for(var j=1;j<orden.length;j++){
        var g = orden[j]-orden[j-1];
        gaps.push({de:orden[j-1], a:orden[j], d:g});
        if(g !== paso){ iguales = false; }
      }

      var chips = el("div","distancias");
      for(var k=0;k<gaps.length;k++){
        chips.appendChild(html("span","dist " + (gaps[k].d === paso ? "igual" : "difiere"),
          '<span>' + gaps[k].de + '→' + gaps[k].a + '</span><strong>' + gaps[k].d + '</strong>'));
      }
      zonaDist.appendChild(chips);

      if(iguales){
        sumar(20, bRev);
        zonaFB.appendChild(feedback("ok","Cantero perfecto",
          "Entre maceta y maceta hay siempre " + paso + " casillero(s), así que Número repite exactamente el mismo salto.",
          "En Scratch se logra usando siempre el mismo número en «mover ( ) pasos»."));
        bRev.disabled = true;
        var r = bRev.getBoundingClientRect();
        celebrar(r.left + r.width/2, r.top);
        pie.innerHTML = "";
        botonSiguiente(pie, "Terminar actividad");
      }else{
        for(var m=0;m<gaps.length;m++){
          if(gaps[m].d !== paso){
            for(var c=gaps[m].de+1; c<gaps[m].a; c++){ celdas[c].className += " resaltada"; }
          }
        }
        zonaFB.appendChild(feedback("casi","Casi…",
          "Mirá los saltos de arriba: no todos miden lo mismo. Los casilleros marcados son los que sobran o faltan.",
          "Contá cuántos casilleros vacíos hay entre una maceta y la siguiente. Tiene que ser siempre la misma cantidad."));
      }
    });
  }

  /* ============================================================
     SECUENCIA
     ============================================================ */
  function juegoSecuencia(host, act){
    var correcto = act.bloques;
    var restantes = mezclar(correcto);
    var puestos = 0, errores = 0;

    var taller = el("div","taller");

    var pA = el("div","panel");
    pA.appendChild(html("h4", null, ICO.bloques + "Bloques sueltos"));
    var listaA = el("div","pila"); pA.appendChild(listaA);

    var pB = el("div","panel destino");
    pB.appendChild(html("h4", null, ICO.banderin + "Programa de Número"));
    var listaB = el("div","pila"); pB.appendChild(listaB);

    taller.appendChild(pA); taller.appendChild(pB);
    host.appendChild(taller);

    var zonaFB = el("div"); host.appendChild(zonaFB);
    var pie = el("div"); host.appendChild(pie);

    function pintarSueltos(){
      listaA.innerHTML = "";
      if(restantes.length === 0){
        listaA.appendChild(el("p","vacio","No queda ningún bloque suelto."));
        return;
      }
      for(var i=0;i<restantes.length;i++){
        (function(bl){
          var b = html("button","bloque b-" + bl.cat,
            '<span class="cat-ic">' + CAT_ICO[bl.cat] + '</span>' + bl.t);
          b.addEventListener("click", function(){ elegir(bl); });
          listaA.appendChild(b);
        })(restantes[i]);
      }
    }

    function elegir(bl){
      zonaFB.innerHTML = "";
      if(bl === correcto[puestos]){
        var v = listaB.querySelector(".vacio");
        if(v){ listaB.innerHTML = ""; }
        listaB.appendChild(html("div","bloque puesto b-" + bl.cat + (bl.indent ? " sangria" : ""),
          '<span class="cat-ic">' + CAT_ICO[bl.cat] + '</span>' + bl.t));
        restantes.splice(restantes.indexOf(bl),1);
        puestos++;
        pintarSueltos();
        if(puestos === correcto.length){
          var gan = Math.max(10, 30 - errores*5);
          sumar(gan, pB);
          zonaFB.appendChild(feedback("ok","Programa armado",
            "Ganaste " + gan + " puntos. " + (errores > 0
              ? "Probaste " + errores + " bloque(s) fuera de orden, y así también se aprende."
              : "Lo ordenaste sin equivocarte ni una vez."), null));
          var r = pB.getBoundingClientRect();
          celebrar(r.left + r.width/2, r.top + 40);
          botonSiguiente(pie, "Terminar actividad");
        }
      }else{
        errores++;
        var cat = correcto[puestos].cat;
        zonaFB.appendChild(feedback("casi","Todavía no va ahí",
          puestos === 0
            ? "Pensá qué tiene que pasar primero de todo para que el programa arranque."
            : "Pensá qué sucede justo después de «" + correcto[puestos-1].t + "».",
          'El próximo bloque es de la categoría <span class="pill-cat" style="background:' + CAT_COL[cat] + '">' + CAT_ICO[cat] + CAT_NOM[cat] + '</span>'));
      }
    }

    pintarSueltos();
    listaB.appendChild(el("p","vacio","Acá se arma el programa, de arriba hacia abajo."));
  }

     ============================================================ */
  function juegoParejas(host, act){
    var conceptos = mezclar(act.pares), definiciones = mezclar(act.pares);
    var elegido = null, botonElegido = null, hechas = 0;

    var grid = el("div","parejas");
    var colA = el("div","col"), colB = el("div","col");
    colA.appendChild(el("div","cab","Palabras"));
    colB.appendChild(el("div","cab","Significados"));
    grid.appendChild(colA); grid.appendChild(colB);
    host.appendChild(grid);

    var zonaFB = el("div"); host.appendChild(zonaFB);
    var pie = el("div"); host.appendChild(pie);

    function limpiar(){
      if(botonElegido){ botonElegido.className = "par-btn concepto"; }
      elegido = null; botonElegido = null;
    }

    for(var i=0;i<conceptos.length;i++){
      (function(par){
        var b = html("button","par-btn concepto",
          '<span class="pin">' + ICO.union + '</span><span>' + par.a + '</span>');
        b.addEventListener("click", function(){
          zonaFB.innerHTML = "";
          limpiar();
          elegido = par; botonElegido = b;
          b.className = "par-btn concepto elegido";
        });
        colA.appendChild(b);
      })(conceptos[i]);
    }

    for(var j=0;j<definiciones.length;j++){
      (function(par){
        var b = html("button","par-btn",
          '<span class="pin">' + ICO.circulo + '</span><span>' + par.b + '</span>');
        b.addEventListener("click", function(){
          zonaFB.innerHTML = "";
          if(!elegido){
            zonaFB.appendChild(feedback("info","Elegí primero una palabra",
              "Tocá una palabra de la izquierda y después su significado.", null));
            return;
          }
          if(elegido === par){
            sumar(10, b);
            hechas++;
            botonElegido.className = "par-btn concepto unido";
            botonElegido.querySelector(".pin").innerHTML = ICO.tilde;
            botonElegido.disabled = true;
            b.className = "par-btn unido";
            b.querySelector(".pin").innerHTML = ICO.tilde;
            b.disabled = true;
            elegido = null; botonElegido = null;
            if(hechas === act.pares.length){
              zonaFB.appendChild(feedback("ok","Uniste todas",
                "Estas son las palabras que usamos durante todo el proyecto de Número.", null));
              var r = grid.getBoundingClientRect();
              celebrar(r.left + r.width/2, r.top + 60);
              botonSiguiente(pie, "Terminar actividad");
            }else{
              zonaFB.appendChild(feedback("ok","Par correcto",
                "Quedan " + (act.pares.length - hechas) + " palabras por unir.", null));
            }
          }else{
            zonaFB.appendChild(feedback("casi","Ese no es el par",
              "Esa definición no corresponde a «" + elegido.a + "». Volvé a leerla con calma y probá otra.", null));
            limpiar();
          }
        });
        colB.appendChild(b);
      })(definiciones[j]);
    }
  }

      '<ellipse cx="-18" cy="9" rx="10" ry="5.4" fill="#246E48"/><ellipse cx="18" cy="9" rx="10" ry="5.4" fill="#246E48"/>' +
      '<ellipse cx="0" cy="0" rx="25" ry="17.4" fill="#2F8A5B"/>' +

    m.appendChild(el("h2",null,"Excelente, buen trabajo"));
    m.appendChild(el("p",null,"Terminaron los juegos de la Etapa " + e.n + ". Ahora llevamos lo aprendido a Scratch: esta página es la guía, el proyecto se programa allá."));
    m.appendChild(html("div","puntos-mini", ICO.estrella + " " + puntos + " puntos en la sesión"));

    var f = el("div","fila");
    var a = document.createElement("a");
    a.className = "btn btn-cta";
    a.href = URL_SCRATCH;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = ICO.cohete + "Vamos a Scratch";
    f.appendChild(a);
    var b = html("button","btn btn-2","Quedarme acá");
    b.addEventListener("click", cerrar);
    f.appendChild(b);
    m.appendChild(f);
    m.appendChild(el("p","nota","Scratch se abre en otra pestaña, así no perdés lo que hiciste acá."));

    function cerrar(){
      if(telon.parentNode){ document.body.removeChild(telon); }
      document.removeEventListener("keydown", porTecla);
    }
    function porTecla(ev){ if(ev.keyCode === 27){ cerrar(); } }
    telon.addEventListener("click", function(ev){ if(ev.target === telon){ cerrar(); } });
    document.addEventListener("keydown", porTecla);

    telon.appendChild(m);
    document.body.appendChild(telon);
    a.focus();
  }

  render();
})();
