<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Número, la rana — Juegos del proyecto</title>
<style>
  :root{
    --tinta:#1B2E3F;
    --papel:#FFFDF6;
    --renglon:#CFE3EF;
    --margen:#E86A6A;
    --verde:#2E9E4F;
    --verde-osc:#17612F;
    --verde-claro:#D6F0DC;
    --flor:#FFC93C;
    --rosa:#E8467C;
    --cielo:#A8DDF0;
    --tierra:#9A6B41;
    --tierra-osc:#5E3D22;
    --gris:#7B8F9C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Verdana,"DejaVu Sans",Geneva,sans-serif;
    color:var(--tinta);font-size:16px;line-height:1.5;background:var(--cielo);
  }
  .app{max-width:900px;margin:0 auto;padding:16px 12px 70px;}

  /* ---------- HERO ---------- */
  .hero{
    background:#fff;border:3px solid var(--tinta);border-radius:20px;
    overflow:hidden;box-shadow:0 6px 0 var(--tinta);
  }
  .hero-svg{display:block;width:100%;height:auto;}
  .hero-txt{
    padding:12px 18px 14px;display:flex;flex-wrap:wrap;
    align-items:flex-end;justify-content:space-between;gap:12px;
    border-top:3px solid var(--tinta);
  }
  h1{
    font-family:"Trebuchet MS","DejaVu Sans",sans-serif;
    font-size:28px;line-height:1.05;margin:0;letter-spacing:-.5px;
    text-shadow:2px 2px 0 var(--flor);
  }
  .eyebrow{
    font-family:"Courier New",monospace;font-size:11px;letter-spacing:2px;
    text-transform:uppercase;color:var(--verde-osc);margin:0 0 4px;
  }
  .marcador{
    font-family:"Courier New",monospace;background:var(--flor);
    border:3px solid var(--tinta);border-radius:12px;padding:6px 14px;
    font-weight:bold;font-size:16px;box-shadow:0 4px 0 var(--tinta);white-space:nowrap;
  }

  /* ---------- PESTAÑAS ---------- */
  .pestanas{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding:4px 2px 10px;}
  .pes{
    flex:none;font-family:"Trebuchet MS",sans-serif;font-weight:bold;font-size:14px;
    background:#fff;border:3px solid var(--tinta);border-radius:12px;
    padding:9px 14px;cursor:pointer;box-shadow:0 4px 0 var(--tinta);color:var(--gris);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .pes:hover{transform:translateY(2px);box-shadow:0 2px 0 var(--tinta);}
  .pes.abierta{color:var(--tinta);}
  .pes.lista{background:var(--verde-claro);color:var(--verde-osc);}
  .pes.activa{background:var(--verde);color:#fff;}

  /* ---------- HOJA ---------- */
  .hoja{
    position:relative;background:var(--papel);
    background-image:repeating-linear-gradient(to bottom, transparent 0 33px, var(--renglon) 33px 34px);
    border:3px solid var(--tinta);border-radius:18px;
    padding:22px 20px 22px 46px;box-shadow:0 6px 0 var(--tinta);
  }
  .hoja::before{content:"";position:absolute;top:0;bottom:0;left:30px;width:2px;background:var(--margen);opacity:.6;}
  .hoja::after{
    content:"";position:absolute;top:14px;bottom:14px;left:10px;width:10px;
    background-image:radial-gradient(circle, var(--tinta) 0 3px, transparent 4px);
    background-size:10px 30px;opacity:.35;
  }
  h2{font-family:"Trebuchet MS",sans-serif;font-size:22px;margin:0 0 2px;color:var(--verde-osc);}
  h3{font-family:"Trebuchet MS",sans-serif;font-size:17px;margin:0 0 6px;}
  .sub{font-family:"Courier New",monospace;font-size:12px;letter-spacing:1px;color:var(--gris);text-transform:uppercase;margin:0 0 10px;}
  .consigna{margin:8px 0 16px;font-size:14.5px;}

  /* ---------- BOTONES ---------- */
  button{
    font-family:inherit;font-size:15px;cursor:pointer;
    border:3px solid var(--tinta);border-radius:12px;padding:12px 18px;
    background:#fff;color:var(--tinta);box-shadow:0 4px 0 var(--tinta);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:hover:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--tinta);}
  button:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--tinta);}
  button:disabled{opacity:.55;cursor:default;}
  button:focus-visible{outline:3px solid var(--rosa);outline-offset:3px;}
  .btn-verde{background:var(--verde);color:#fff;font-weight:bold;}
  .btn-flor{background:var(--flor);font-weight:bold;}
  .fila{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}

  /* ---------- CANDADO ---------- */
  .candado{text-align:center;padding:10px 0;}
  .candado .icono{font-size:54px;}
  .candado input{
    font-family:"Courier New",monospace;font-size:20px;text-align:center;
    border:3px solid var(--tinta);border-radius:12px;padding:11px 14px;
    width:220px;max-width:100%;letter-spacing:3px;background:#fff;color:var(--tinta);
  }
  .candado input:focus{outline:3px solid var(--rosa);outline-offset:2px;}

  /* ---------- FEEDBACK ---------- */
  .feedback{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14px;border:3px solid var(--tinta);display:none;}
  .feedback.ok{display:block;background:var(--verde-claro);}
  .feedback.mal{display:block;background:#FFE1EA;}
  .feedback strong{font-family:"Trebuchet MS",sans-serif;}

  .puntitos{display:flex;gap:6px;margin-top:14px;align-items:center;flex-wrap:wrap;}
  .puntito{width:12px;height:12px;border-radius:50%;border:2px solid var(--tinta);background:#fff;}
  .puntito.hecho{background:var(--verde);}
  .puntito.actual{background:var(--flor);}
  .puntitos .txt{font-family:"Courier New",monospace;font-size:12px;margin-left:6px;color:var(--gris);}

  /* ---------- QUIZ ---------- */
  .pregunta{font-family:"Trebuchet MS",sans-serif;font-size:18px;font-weight:bold;color:var(--verde-osc);margin:0 0 14px;}
  .opciones{display:grid;gap:10px;}
  .opciones button{text-align:left;padding:13px 16px;background:#fff;}

  .vitrina{
    position:relative;border:3px solid var(--tinta);border-radius:14px;height:150px;overflow:hidden;
    background:linear-gradient(#BFE9F7 0 58%, var(--verde) 58% 80%, var(--tierra) 80% 100%);
  }
  .vitrina .sol{position:absolute;top:10px;right:14px;font-size:24px;}
  .vitrina .pieza{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:58px;}
  .cinta{
    position:absolute;top:9px;left:9px;font-family:"Courier New",monospace;font-size:11px;letter-spacing:1px;
    background:var(--papel);border:2px solid var(--tinta);border-radius:8px;padding:2px 8px;
  }
  .par2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .par2 button{padding:16px 8px;font-size:16px;font-weight:bold;text-align:center;}

  .jardin{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
    background:linear-gradient(var(--verde) 0 70%, var(--tierra) 70% 100%);
    border:3px solid var(--tinta);border-radius:14px;padding:14px 12px;
  }
  .flor-btn{
    background:var(--flor);border:3px solid var(--tinta);border-radius:50%;
    aspect-ratio:1/1;font-family:"Courier New",monospace;font-weight:bold;font-size:19px;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .flor-btn.mala{background:#FFB3C6;}
  .flor-btn.buena{background:var(--verde-claro);}

  /* ---------- CANTERO ---------- */
  .cantero{
    display:grid;grid-template-columns:repeat(12,1fr);gap:4px;background:var(--tierra);
    border:3px solid var(--tierra-osc);border-radius:14px 14px 6px 6px;padding:8px;
    box-shadow:0 5px 0 var(--tierra-osc);
  }
  .celda{
    aspect-ratio:1/1;background:#F0E4CD;border:2px dashed #B99B72;border-radius:8px;
    box-shadow:none;padding:0;font-size:20px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .celda:hover:not(:disabled){transform:none;box-shadow:none;background:#FBF2E0;}
  .celda.puesta{background:var(--verde-claro);border:2px solid var(--verde-osc);}
  .regla{
    display:grid;grid-template-columns:repeat(12,1fr);gap:4px;padding:6px 11px 0;
    font-family:"Courier New",monospace;font-size:12px;text-align:center;color:var(--gris);
  }
  .contador{font-family:"Courier New",monospace;font-size:14px;margin:14px 0 0;}

  /* ---------- BLOQUES ---------- */
  .zona{border:3px dashed var(--gris);border-radius:14px;padding:12px;background:#fff;min-height:80px;}
  .zona h4{margin:0 0 10px;font-family:"Courier New",monospace;font-size:12px;letter-spacing:1px;color:var(--gris);text-transform:uppercase;}
  .bloques{display:grid;gap:8px;}
  .bloque{
    text-align:left;color:#fff;font-size:14px;font-weight:bold;border:3px solid rgba(0,0,0,.35);
    border-radius:8px;padding:11px 14px;box-shadow:0 3px 0 rgba(0,0,0,.35);
    font-family:"Trebuchet MS",sans-serif;
  }
  .bloque.indent{margin-left:20px;}
  .b-evento{background:#F0A800;}
  .b-movimiento{background:#4C97FF;}
  .b-lapiz{background:#0FBD8C;}
  .b-control{background:#E58B12;}
  .b-apariencia{background:#9966FF;}
  .b-sensores{background:#4EA3C7;}
  .col2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* ---------- PAREJAS ---------- */
  .parejas{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .parejas button{text-align:left;font-size:14px;padding:11px 13px;}
  .parejas .concepto{font-family:"Trebuchet MS",sans-serif;font-weight:bold;background:var(--flor);}
  .parejas button.sel{outline:4px solid var(--rosa);outline-offset:2px;}
  .parejas button.listo{background:var(--verde-claro);color:var(--verde-osc);opacity:.7;}

  /* ---------- CARTEL FLOTANTE ---------- */
  .telon{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(27,46,63,.72);
    display:flex;align-items:center;justify-content:center;
    padding:18px;z-index:50;
  }
  .cartel{
    background:var(--papel);border:3px solid var(--tinta);border-radius:20px;
    box-shadow:0 8px 0 var(--tinta);
    max-width:440px;width:100%;padding:26px 24px;text-align:center;
  }
  .cartel .rana{font-size:56px;line-height:1;}
  .cartel h2{font-size:24px;margin:6px 0 8px;}
  .cartel p{font-size:15px;margin:0 0 6px;}
  .cartel .pts{font-family:"Courier New",monospace;font-weight:bold;color:var(--verde-osc);font-size:15px;}
  .cartel .fila{justify-content:center;}
  .cartel a.btn{
    display:inline-block;text-decoration:none;font-family:inherit;font-size:15px;font-weight:bold;
    border:3px solid var(--tinta);border-radius:12px;padding:12px 18px;
    background:var(--flor);color:var(--tinta);box-shadow:0 4px 0 var(--tinta);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .cartel a.btn:hover{transform:translateY(2px);box-shadow:0 2px 0 var(--tinta);}
  .cartel a.btn:focus-visible{outline:3px solid var(--rosa);outline-offset:3px;}
  .aviso-pestana{font-size:12px;color:var(--gris);margin-top:12px;}

  @media (prefers-reduced-motion:no-preference){
    .cartel{animation:aparece .3s ease;}
    @keyframes aparece{
      0%{transform:scale(.85) translateY(14px);opacity:0;}
      100%{transform:scale(1) translateY(0);opacity:1;}
    }
  }

  /* ---------- CIERRE ---------- */
  .cierre{text-align:center;}
  .medalla{
    font-size:52px;display:inline-flex;align-items:center;justify-content:center;
    width:96px;height:96px;background:var(--flor);border:3px solid var(--tinta);
    border-radius:50%;box-shadow:0 6px 0 var(--tinta);
  }
  .puntaje{font-family:"Courier New",monospace;font-size:34px;font-weight:bold;color:var(--verde-osc);margin:12px 0 2px;}
  .reflexion{
    text-align:left;background:#fff;border:3px solid var(--tinta);border-radius:14px;
    padding:14px 16px;margin-top:18px;box-shadow:0 4px 0 var(--tinta);
  }
  .reflexion h3{color:var(--rosa);font-size:15px;}
  .reflexion ul{margin:0;padding-left:20px;}
  .reflexion li{margin-bottom:8px;font-size:14px;}

  @media (prefers-reduced-motion:no-preference){
    .brinca{animation:brinco .55s ease;}
    @keyframes brinco{
      0%{transform:translate(-50%,-50%) scale(.7) rotate(-6deg);}
      60%{transform:translate(-50%,-64%) scale(1.06) rotate(3deg);}
      100%{transform:translate(-50%,-50%) scale(1) rotate(0);}
    }
    #rana-hero{animation:salta 3.4s ease-in-out infinite;}
    @keyframes salta{
      0%,100%{transform:translate(0,0);}
      25%{transform:translate(78px,-30px);}
      50%{transform:translate(156px,0);}
      75%{transform:translate(234px,-30px);}
    }
    .tiembla{animation:tiemble .3s ease;}
    @keyframes tiemble{
      0%,100%{transform:translateX(0);}
      25%{transform:translateX(-7px);}
      75%{transform:translateX(7px);}
    }
  }
  @media (max-width:560px){
    h1{font-size:22px;}
    .hoja{padding:18px 14px 18px 40px;}
    .par2,.col2,.parejas{grid-template-columns:1fr;}
    .celda{font-size:14px;}
    .regla{font-size:9px;}
    .jardin{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="app">

  <div class="hero">
    <svg class="hero-svg" viewBox="0 0 400 110" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Número la rana saltando de flor en flor">
      <rect width="400" height="110" fill="#BFE9F7"/>
      <circle cx="356" cy="24" r="15" fill="#FFC93C"/>
      <rect y="82" width="400" height="28" fill="#2E9E4F"/>
      <rect y="104" width="400" height="6" fill="#9A6B41"/>
      <path d="M22 82 Q61 34 100 82 Q139 34 178 82 Q217 34 256 82 Q295 34 334 82"
            fill="none" stroke="#17612F" stroke-width="2" stroke-dasharray="5 5" opacity=".55"/>
      <g fill="#E8467C">
        <circle cx="100" cy="76" r="6"/><circle cx="178" cy="76" r="6"/>
        <circle cx="256" cy="76" r="6"/><circle cx="334" cy="76" r="6"/>
      </g>
      <g fill="#FFC93C">
        <circle cx="100" cy="76" r="2.5"/><circle cx="178" cy="76" r="2.5"/>
        <circle cx="256" cy="76" r="2.5"/><circle cx="334" cy="76" r="2.5"/>
      </g>
      <g stroke="#17612F" stroke-width="2">
        <line x1="100" y1="82" x2="100" y2="94"/><line x1="178" y1="82" x2="178" y2="94"/>
        <line x1="256" y1="82" x2="256" y2="94"/><line x1="334" y1="82" x2="334" y2="94"/>
      </g>
      <text id="rana-hero" x="14" y="82" font-size="26">🐸</text>
    </svg>
    <div class="hero-txt">
      <div>
        <p class="eyebrow">Pensamiento Computacional · 7 etapas</p>
        <h1>Número, la rana</h1>
      </div>
      <div class="marcador">Puntos: <span id="puntos">0</span></div>
    </div>
  </div>

  <nav class="pestanas" id="pestanas" aria-label="Etapas del proyecto"></nav>
  <main id="contenido"></main>

</div>

<script>
(function(){
  "use strict";

  var ETAPAS = [
    {
      n:1, clave:"numero",
      titulo:"El jardín de Número",
      sub:"Objetos, fondos y distancias iguales",
      cierre:[
        "¿Qué dificultades tendríamos si dibujáramos a Número dentro del fondo?",
        "¿Qué ventaja tiene que Número sea un objeto y no parte del dibujo del jardín?",
        "¿Cómo hacemos para que las flores queden a la misma distancia en Scratch?"
      ],
      actividades:[
        {tipo:"quiz", render:"vitrina", titulo:"¿Objeto o fondo?",
         consigna:"El <strong>fondo</strong> es la imagen que ocupa toda la pantalla y queda atrás de todo. El <strong>objeto</strong> es un personaje que se programa aparte y puede moverse.",
         preguntas:[
          {emoji:"🐸", p:"Número, la rana que salta de flor en flor", o:["Es un OBJETO","Es el FONDO"], c:0,
           r:"Número tiene que moverse sola. Dibujada en el fondo quedaría pegada y no podríamos programarla."},
          {emoji:"🏫", p:"El patio de la escuela con el cielo y el pasto", o:["Es un OBJETO","Es el FONDO"], c:1,
           r:"Ocupa toda la pantalla y no se mueve: es el fondo del escenario."},
          {emoji:"🌻", p:"Una flor que se ilumina cuando Número la toca", o:["Es un OBJETO","Es el FONDO"], c:0,
           r:"Si tiene que cambiar o reaccionar, necesita ser un objeto con su propio programa."},
          {emoji:"🔲", p:"La cuadrícula que nos ayuda a medir distancias", o:["Es un OBJETO","Es el FONDO"], c:1,
           r:"Es parte del dibujo del escenario: sirve de guía, pero no se programa."},
          {emoji:"⏱️", p:"El reloj que avisa cuánto tiempo queda", o:["Es un OBJETO","Es el FONDO"], c:0,
           r:"El reloj cambia mientras el juego corre, así que va como objeto."},
          {emoji:"☁️", p:"El cielo celeste del jardín", o:["Es un OBJETO","Es el FONDO"], c:1,
           r:"Está dibujado detrás de todo y ocupa la pantalla entera."},
          {emoji:"🪴", p:"Una maceta que se puede arrastrar de lugar", o:["Es un OBJETO","Es el FONDO"], c:0,
           r:"Si la vamos a mover, tiene que ser un objeto."},
          {emoji:"🌳", p:"Los árboles pintados al costado del patio", o:["Es un OBJETO","Es el FONDO"], c:1,
           r:"Son parte del paisaje y no hacen nada: quedan en el fondo."}
         ]},
        {tipo:"cantero", titulo:"Macetas a igual distancia",
         consigna:"Ubicá las macetas de modo que la distancia entre una y la siguiente sea siempre la misma. Así Número repite siempre el mismo salto."}
      ]
    },

    {
      n:2, clave:"salto",
      titulo:"Desplazamiento de flor en flor",
      sub:"Del algoritmo al programa · Eventos",
      cierre:[
        "¿Todos armaron el salto con los mismos bloques?",
        "¿Qué pasa si cambiamos el orden de las instrucciones?",
        "¿Qué otros eventos podríamos usar para que Número salte?"
      ],
      actividades:[
        {tipo:"secuencia", titulo:"Armá el salto de Número",
         consigna:"Tocá los bloques en el orden correcto para que Número salte a la flor siguiente dejando un rastro de color.",
         bloques:[
          {t:"al presionar tecla flecha derecha", cat:"evento"},
          {t:"apuntar en dirección 90", cat:"movimiento"},
          {t:"bajar lápiz", cat:"lapiz"},
          {t:"mover 60 pasos", cat:"movimiento"},
          {t:"subir lápiz", cat:"lapiz"}
         ]},
        {tipo:"quiz", render:"normal", titulo:"Eventos y programas",
         consigna:"Cinco preguntas sobre lo que trabajamos en la videoconferencia.",
         preguntas:[
          {p:"¿Qué es un evento en Scratch?", o:["Un dibujo del escenario","Algo que ocurre y hace arrancar el programa","Un error del juego"], c:1,
           r:"Un evento es información de entrada: presionar una tecla, hacer clic o tocar la bandera verde."},
          {p:"¿Qué pasa si cambiamos el orden de las instrucciones?", o:["No cambia nada","El resultado puede ser distinto","El programa se borra"], c:1,
           r:"El orden importa: la computadora ejecuta un paso después del otro."},
          {p:"Para que Número dibuje un cuadrado, ¿cuánto tiene que girar en cada esquina?", o:["45 grados","60 grados","90 grados"], c:2,
           r:"El cuadrado tiene ángulos de 90°, igual que el rectángulo."},
          {p:"El bloque «mover 10 pasos» pertenece a la categoría…", o:["Movimiento","Apariencia","Sonido"], c:0,
           r:"Los bloques azules de Movimiento cambian la posición del objeto."},
          {p:"Un programa es…", o:["Un dibujo animado","Un algoritmo escrito para que lo interprete la computadora","Una carpeta de archivos"], c:1,
           r:"Los bloques son símbolos que la computadora interpreta de una única manera."}
         ]}
      ]
    },

    {
      n:3, clave:"jardin",
      titulo:"Desafíos matemáticos en el jardín",
      sub:"Interactividad · La rana pregunta",
      cierre:[
        "¿Cuándo decimos que un juego es interactivo?",
        "¿En qué momento el personaje presenta el desafío matemático?",
        "¿Qué programas interactivos usan todos los días?"
      ],
      actividades:[
        {tipo:"quiz", render:"flores", titulo:"Saltá a la flor correcta",
         consigna:"Número te lanza un desafío y tenés que llevarla hasta la flor con la respuesta correcta.",
         preguntas:[
          {p:"Número pregunta: ¿cuál de estos números es múltiplo de 5?", o:["12","27","35","44"], c:2,
           r:"35 = 5 × 7, así que es múltiplo de 5."},
          {p:"Número pregunta: ¿cuál tiene un 7 en el lugar de las decenas?", o:["378","731","217","907"], c:0,
           r:"En 378 el 7 ocupa las decenas: 3 centenas, 7 decenas y 8 unidades."},
          {p:"Número pregunta: ¿cuál es el doble de 24?", o:["42","46","48","44"], c:2,
           r:"24 + 24 = 48."},
          {p:"Número pregunta: ¿cuál de estos números es divisor de 36?", o:["7","8","9","10"], c:2,
           r:"36 : 9 = 4 exacto, así que 9 es divisor de 36."},
          {p:"Número pregunta: ¿cuál está entre 450 y 460?", o:["449","455","461","470"], c:1,

  /* ==================== ESTADO ==================== */
  var puntos = 0;
  var etapaActiva = 0;
  var abiertas = [];
  var progreso = [];
  var cartelVisto = [];
  for(var z=0; z<ETAPAS.length; z++){ abiertas.push(false); progreso.push(0); cartelVisto.push(false); }
  var URL_SCRATCH = "https://scratch.mit.edu/projects/editor";

  var elPuntos = document.getElementById("puntos");
  var elPest = document.getElementById("pestanas");
  var elCont = document.getElementById("contenido");

  function sumar(n){ puntos += n; elPuntos.textContent = puntos; }

  function norm(s){
    s = String(s).toLowerCase().replace(/^\s+|\s+$/g,"");
    if(s.normalize){ s = s.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
    return s;
  }

  function mezclar(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function el(tag, clase, texto){
    var e = document.createElement(tag);
    if(clase){ e.className = clase; }
    if(texto !== undefined && texto !== null){ e.textContent = texto; }
    return e;
  }

  /* ==================== PESTAÑAS ==================== */
  function pintarPestanas(){
    elPest.innerHTML = "";
    for(var i=0;i<ETAPAS.length;i++){
      (function(i){
        var e = ETAPAS[i];
        var b = el("button","pes");
        var completa = abiertas[i] && progreso[i] >= e.actividades.length;
        b.textContent = "Etapa " + e.n + (abiertas[i] ? (completa ? " ✓" : "") : " 🔒");
        if(abiertas[i]){ b.className += " abierta"; }
        if(completa){ b.className += " lista"; }
        if(i === etapaActiva){ b.className += " activa"; }
        b.addEventListener("click", function(){ etapaActiva = i; render(); });
        elPest.appendChild(b);
      })(i);
    }
  }

  /* ==================== RENDER ==================== */
  function render(){
    pintarPestanas();
    elCont.innerHTML = "";
    var hoja = el("div","hoja");
    elCont.appendChild(hoja);
    var e = ETAPAS[etapaActiva];

    if(!abiertas[etapaActiva]){ renderCandado(hoja, e); return; }

    hoja.appendChild(el("p","sub","Etapa " + e.n + " · " + e.sub));
    hoja.appendChild(el("h2", null, e.titulo));

    if(progreso[etapaActiva] >= e.actividades.length){
      renderCierre(hoja, e);
      if(!cartelVisto[etapaActiva]){
        cartelVisto[etapaActiva] = true;
        mostrarCartel(e);
      }
      return;
    }

    var act = e.actividades[progreso[etapaActiva]];
    hoja.appendChild(el("h3", null, act.titulo));
    var c = el("p","consigna"); c.innerHTML = act.consigna; hoja.appendChild(c);

    var host = el("div"); hoja.appendChild(host);

    if(act.tipo === "quiz"){ juegoQuiz(host, act); }
    if(act.tipo === "cantero"){ juegoCantero(host); }
    if(act.tipo === "secuencia"){ juegoSecuencia(host, act); }
    if(act.tipo === "parejas"){ juegoParejas(host, act); }
    window.scrollTo(0,0);
  }

  function terminarActividad(){
    progreso[etapaActiva]++;
    render();
  }

  function botonSiguiente(host, texto){
    var f = el("div","fila");
    var b = el("button","btn-verde", texto || "Siguiente →");
    b.addEventListener("click", terminarActividad);
    f.appendChild(b);
    host.appendChild(f);
    b.focus();
  }

  /* ==================== CANDADO ==================== */
  function renderCandado(hoja, e){
    var d = el("div","candado");
    d.appendChild(el("div","icono","🔒"));
    d.appendChild(el("h2",null,"Etapa " + e.n + " bloqueada"));
    var p = el("p","consigna");
    p.innerHTML = "Esta etapa se abre con una clave. Pedísela a tu docente cuando lleguemos a esta parte del proyecto.";
    p.style.textAlign = "center";
    d.appendChild(p);

    var inp = document.createElement("input");
    inp.type = "text";
    inp.setAttribute("placeholder","clave");
    inp.setAttribute("aria-label","Clave de la etapa " + e.n);
    inp.setAttribute("autocomplete","off");
    d.appendChild(inp);

    var fb = el("div","feedback");
    var f = el("div","fila");
    f.style.justifyContent = "center";
    var b = el("button","btn-flor","Abrir etapa");

    function intentar(){
      if(norm(inp.value) === e.clave){
        abiertas[etapaActiva] = true;
        render();
      }else{
        fb.className = "feedback mal";
        fb.innerHTML = "Esa no es la clave. Escribila de nuevo (las mayúsculas no importan).";
        inp.value = "";
        inp.focus();
        inp.className = "";
        void inp.offsetWidth;
        inp.className = "tiembla";
      }
    }
    b.addEventListener("click", intentar);
    inp.addEventListener("keydown", function(ev){ if(ev.keyCode === 13){ intentar(); } });
    f.appendChild(b);
    d.appendChild(f);
    d.appendChild(fb);
    hoja.appendChild(d);
    inp.focus();
  }

  /* ==================== QUIZ ==================== */
  function juegoQuiz(host, act){
    var lista = mezclar(act.preguntas);
    var i = 0;
    var pieza = null;

    if(act.render === "vitrina"){
      var vitrina = el("div","vitrina");
      vitrina.appendChild(el("span","cinta","JARDÍN DE LA ESCUELA"));
      vitrina.appendChild(el("span","sol","☀️"));
      pieza = el("span","pieza","🐸");
      vitrina.appendChild(pieza);
      host.appendChild(vitrina);
    }

    var preg = el("p","pregunta");
    preg.style.marginTop = "16px";
    host.appendChild(preg);

    var claseCont = "opciones";
    if(act.render === "flores"){ claseCont = "jardin"; }
    if(act.render === "vitrina"){ claseCont = "par2"; }
    var cont = el("div", claseCont);
    host.appendChild(cont);

    var fb = el("div","feedback"); host.appendChild(fb);
    var dots = el("div","puntitos"); host.appendChild(dots);
    var pie = el("div"); host.appendChild(pie);

    function dibujarDots(){
      dots.innerHTML = "";
      for(var k=0;k<lista.length;k++){
        dots.appendChild(el("span","puntito" + (k<i ? " hecho" : (k===i ? " actual":""))));
      }
      dots.appendChild(el("span","txt",(i<lista.length ? i+1 : lista.length) + "/" + lista.length));
    }

    function pintar(){
      var q = lista[i];
      if(pieza){
        pieza.textContent = q.emoji || "🐸";
        pieza.className = "pieza";
        void pieza.offsetWidth;
        pieza.className = "pieza brinca";
      }
      preg.textContent = q.p;
      cont.innerHTML = "";
      fb.className = "feedback";
      pie.innerHTML = "";
      for(var k=0;k<q.o.length;k++){
        (function(k){
          var b;
          if(act.render === "flores"){ b = el("button","flor-btn", q.o[k]); }
          else if(act.render === "vitrina"){ b = el("button", k===0 ? "btn-flor" : "", q.o[k]); }
          else { b = el("button", null, q.o[k]); }
          b.addEventListener("click", function(){ responder(k, b); });
          cont.appendChild(b);
        })(k);
      }
      dibujarDots();
    }

    function responder(k, boton){
      var q = lista[i];
      var bs = cont.getElementsByTagName("button");
      for(var j=0;j<bs.length;j++){ bs[j].disabled = true; }
      if(k === q.c){
        sumar(10);
        fb.className = "feedback ok";
        fb.innerHTML = "<strong>¡Correcto!</strong> " + q.r;
        if(act.render === "flores"){ boton.className = "flor-btn buena"; }
      }else{
        fb.className = "feedback mal";
        fb.innerHTML = "<strong>No era esa.</strong> La respuesta correcta es «" + q.o[q.c] + "». " + q.r;
        if(act.render === "flores"){
          boton.className = "flor-btn mala";
          bs[q.c].className = "flor-btn buena";
        }
      }
      i++;
      dibujarDots();
      var f = el("div","fila");
      if(i < lista.length){
        var b1 = el("button","btn-verde","Siguiente pregunta →");
        b1.addEventListener("click", pintar);
        f.appendChild(b1);
      }else{
        var b2 = el("button","btn-verde","Terminar actividad →");
        b2.addEventListener("click", terminarActividad);
        f.appendChild(b2);
      }
      pie.appendChild(f);
      f.getElementsByTagName("button")[0].focus();
    }

    pintar();
  }

  /* ==================== CANTERO ==================== */
  function juegoCantero(host){
    var TOTAL = 12;
    var pedidas = 3 + Math.floor(Math.random()*2);
    var sel = [];

    var aviso = el("p","consigna");
    aviso.innerHTML = "Ubicá <strong>" + pedidas + " macetas</strong>. Tocá un casillero para poner o sacar una.";
    host.appendChild(aviso);

    var cantero = el("div","cantero");
    var regla = el("div","regla");
    host.appendChild(cantero); host.appendChild(regla);

    var contador = el("p","contador"); host.appendChild(contador);

    var fila = el("div","fila");
    var bRev = el("button","btn-verde","Revisar el cantero");
    var bLim = el("button",null,"Sacar todas");
    fila.appendChild(bRev); fila.appendChild(bLim);
    host.appendChild(fila);

    var fb = el("div","feedback"); host.appendChild(fb);
    var pie = el("div"); host.appendChild(pie);

    function actualizar(){
      contador.textContent = "Macetas puestas: " + sel.length + " de " + pedidas;
    }

    for(var i=0;i<TOTAL;i++){
      (function(pos){
        var b = el("button","celda");
        b.setAttribute("aria-label","Casillero " + pos);
        b.addEventListener("click", function(){
          var idx = sel.indexOf(pos);
          if(idx >= 0){
            sel.splice(idx,1); b.className = "celda"; b.textContent = "";
          }else{
            if(sel.length >= pedidas){
              fb.className = "feedback mal";
              fb.innerHTML = "Ya hay " + pedidas + " macetas. Sacá una si querés cambiarla de lugar.";
              return;
            }
            sel.push(pos); b.className = "celda puesta"; b.textContent = "🌷";
          }
          fb.className = "feedback";
          actualizar();
        });
        cantero.appendChild(b);
        regla.appendChild(el("span",null,String(pos)));
      })(i);
    }
    actualizar();

    bLim.addEventListener("click", function(){
      sel = [];
      var cs = cantero.getElementsByTagName("button");
      for(var j=0;j<cs.length;j++){ cs[j].className = "celda"; cs[j].textContent = ""; }
      fb.className = "feedback";
      pie.innerHTML = "";
      actualizar();
    });

    bRev.addEventListener("click", function(){
      if(sel.length !== pedidas){
        fb.className = "feedback mal";
        fb.innerHTML = "Faltan macetas: tenés que poner exactamente " + pedidas + ".";
        return;
      }
      var orden = sel.slice().sort(function(a,b){ return a-b; });
      var paso = orden[1]-orden[0];
      var iguales = true, det = [];
      for(var j=1;j<orden.length;j++){
        det.push(orden[j]-orden[j-1]);
        if(orden[j]-orden[j-1] !== paso){ iguales = false; }
      }
      if(iguales){
        sumar(20);
        fb.className = "feedback ok";
        fb.innerHTML = "<strong>¡Perfecto!</strong> Entre maceta y maceta hay siempre " + paso +
          " casillero(s). En Scratch se logra usando siempre el mismo número en «mover ( ) pasos».";
        bRev.disabled = true;
        pie.innerHTML = "";
        botonSiguiente(pie, "Terminar actividad →");
      }else{
        fb.className = "feedback mal";
        fb.innerHTML = "<strong>Todavía no.</strong> Las distancias son: " + det.join(", ") +
          ". Si Número salta siempre lo mismo, no va a caer en todas las macetas.";
      }
    });
  }

  /* ==================== SECUENCIA ==================== */
  function juegoSecuencia(host, act){
    var correcto = act.bloques;
    var restantes = mezclar(correcto);
    var puestos = 0, errores = 0;

    var cols = el("div","col2");
    var zonaA = el("div","zona");
    zonaA.appendChild(el("h4",null,"Bloques sueltos"));
    var listaA = el("div","bloques");
    zonaA.appendChild(listaA);

    var zonaB = el("div","zona");
    zonaB.appendChild(el("h4",null,"Programa de Número"));
    var listaB = el("div","bloques");
    zonaB.appendChild(listaB);

    cols.appendChild(zonaA); cols.appendChild(zonaB);
    host.appendChild(cols);

    var fb = el("div","feedback"); host.appendChild(fb);
    var pie = el("div"); host.appendChild(pie);

    function pintarSueltos(){
      listaA.innerHTML = "";
      if(restantes.length === 0){
        listaA.appendChild(el("p","consigna","¡No quedan bloques!"));
        return;
      }
      for(var i=0;i<restantes.length;i++){
        (function(bl){
          var b = el("button","bloque b-" + bl.cat, bl.t);
          b.addEventListener("click", function(){ elegir(bl); });
          listaA.appendChild(b);
        })(restantes[i]);
      }
    }

    function elegir(bl){
      if(bl === correcto[puestos]){
        listaB.appendChild(el("div","bloque b-" + bl.cat + (bl.indent ? " indent" : ""), bl.t));
        restantes.splice(restantes.indexOf(bl),1);
        puestos++;
        fb.className = "feedback";
        pintarSueltos();
        if(puestos === correcto.length){
          var gan = Math.max(10, 30 - errores*5);
          sumar(gan);
          fb.className = "feedback ok";
          fb.innerHTML = "<strong>¡Programa armado!</strong> Ganaste " + gan + " puntos." +
            (errores > 0 ? " Tuviste " + errores + " intento(s) fuera de orden." : " ¡Sin ningún error!");
          botonSiguiente(pie, "Terminar actividad →");
        }
      }else{
        errores++;
        fb.className = "feedback mal";
        fb.innerHTML = "<strong>Ese bloque todavía no va.</strong> Pensá qué tiene que pasar " +
          (puestos === 0 ? "primero de todo para que el programa arranque."
                         : "justo después de «" + correcto[puestos-1].t + "».");
      }
    }

    pintarSueltos();
  }

  /* ==================== PAREJAS ==================== */
  function juegoParejas(host, act){
    var conceptos = mezclar(act.pares);
    var definiciones = mezclar(act.pares);
    var seleccionado = null, botonSel = null, hechas = 0;

    var grid = el("div","parejas");
    var colA = el("div","bloques");
    var colB = el("div","bloques");
    grid.appendChild(colA); grid.appendChild(colB);
    host.appendChild(grid);

    var fb = el("div","feedback"); host.appendChild(fb);
    var pie = el("div"); host.appendChild(pie);

    function limpiarSel(){
      if(botonSel){ botonSel.className = "concepto"; }
      seleccionado = null; botonSel = null;
    }

    for(var i=0;i<conceptos.length;i++){
      (function(par){
        var b = el("button","concepto", par.a);
        b.addEventListener("click", function(){
          limpiarSel();
          seleccionado = par; botonSel = b;
          b.className = "concepto sel";
          fb.className = "feedback";
        });
        colA.appendChild(b);
      })(conceptos[i]);
    }

    for(var j=0;j<definiciones.length;j++){
      (function(par){
        var b = el("button", null, par.b);
        b.addEventListener("click", function(){
          if(!seleccionado){
            fb.className = "feedback mal";
            fb.innerHTML = "Elegí primero una palabra de la columna amarilla.";
            return;
          }
          if(seleccionado === par){
            sumar(10);
            hechas++;
            botonSel.className = "concepto listo"; botonSel.disabled = true;
            b.className = "listo"; b.disabled = true;
            seleccionado = null; botonSel = null;
            fb.className = "feedback ok";
            if(hechas === act.pares.length){
              fb.innerHTML = "<strong>¡Uniste todas!</strong> Estas son las palabras que usamos durante todo el proyecto.";
              botonSiguiente(pie, "Terminar actividad →");
            }else{
              fb.innerHTML = "<strong>¡Bien!</strong> Quedan " + (act.pares.length - hechas) + " palabras.";
            }
          }else{
            fb.className = "feedback mal";
            fb.innerHTML = "Esa definición no corresponde a «" + seleccionado.a + "». Volvé a leerla y probá otra.";
            limpiarSel();
          }
        });
        colB.appendChild(b);
      })(definiciones[j]);
    }
  }

  /* ==================== CARTEL FLOTANTE ==================== */
  function mostrarCartel(e){
    var telon = el("div","telon");
    var c = el("div","cartel");
    c.setAttribute("role","dialog");
    c.setAttribute("aria-modal","true");

    c.appendChild(el("div","rana","🐸"));
    c.appendChild(el("h2",null,"¡Excelente, buen trabajo!"));
    c.appendChild(el("p",null,"Terminaron los juegos de la Etapa " + e.n + ". Ahora seguimos en Scratch: esta página es solo una guía, el proyecto se programa allá."));
    c.appendChild(el("p","pts","Llevás " + puntos + " puntos"));

    var f = el("div","fila");
    var a = document.createElement("a");
    a.className = "btn";
    a.href = URL_SCRATCH;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = "Abrir Scratch →";
    f.appendChild(a);

    var b = el("button",null,"Quedarme acá");
    b.addEventListener("click", cerrar);
    f.appendChild(b);
    c.appendChild(f);

    c.appendChild(el("p","aviso-pestana","Scratch se abre en otra pestaña, así no perdés lo que hiciste acá."));

    function cerrar(){
      if(telon.parentNode){ document.body.removeChild(telon); }
      document.removeEventListener("keydown", porTecla);
    }
    function porTecla(ev){ if(ev.keyCode === 27){ cerrar(); } }

    telon.addEventListener("click", function(ev){ if(ev.target === telon){ cerrar(); } });
    document.addEventListener("keydown", porTecla);

    telon.appendChild(c);
    document.body.appendChild(telon);
    a.focus();
  }

  /* ==================== CIERRE ==================== */
  function renderCierre(hoja, e){
    var d = el("div","cierre");
    d.appendChild(el("div","medalla","🐸"));
    d.appendChild(el("p","puntaje", puntos + " pts"));
    d.appendChild(el("h3",null,"¡Etapa " + e.n + " completa!"));
    d.appendChild(el("p","consigna","Buen trabajo. Ahora vamos a Scratch a programar esta parte del proyecto."));

    var r = el("div","reflexion");
    r.appendChild(el("h3",null,"Para conversar entre todos"));
    var ul = document.createElement("ul");
    for(var i=0;i<e.cierre.length;i++){ ul.appendChild(el("li",null,e.cierre[i])); }
    r.appendChild(ul);
    d.appendChild(r);

    var f = el("div","fila");
    f.style.justifyContent = "center";
    var bS = el("button","btn-flor","Abrir Scratch →");
    bS.addEventListener("click", function(){ mostrarCartel(e); });
    f.appendChild(bS);
    var b1 = el("button",null,"Repetir la etapa");
    b1.addEventListener("click", function(){ progreso[etapaActiva] = 0; render(); });
    f.appendChild(b1);
    if(etapaActiva < ETAPAS.length-1){
      var b2 = el("button","btn-verde","Ir a la Etapa " + ETAPAS[etapaActiva+1].n + " →");
      b2.addEventListener("click", function(){ etapaActiva++; render(); });
      f.appendChild(b2);
    }
    d.appendChild(f);
    hoja.appendChild(d);
  }

  render();
})();
</script>
</body>
