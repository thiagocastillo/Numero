     ============================================================ */
  function juegoCantero(host){
    var TOTAL = 12;
    var pedidas = 3 + Math.floor(Math.random()*2);
    var sel = [], celdas = [];

    host.appendChild(html("p","consigna",
      "Plantá <strong>" + pedidas + " macetas</strong> en el cantero. Tocá un casillero para poner o sacar una."));

    var wrap = el("div","cantero-wrap");
    var cantero = el("div","cantero");
    var reglita = el("div","reglita");
    wrap.appendChild(cantero); wrap.appendChild(reglita);
    host.appendChild(wrap);

    var contador = el("p","contador"); host.appendChild(contador);
    var zonaDist = el("div"); host.appendChild(zonaDist);

    var fila = el("div","fila");
    var bRev = html("button","btn btn-1", ICO.tilde + "Revisar el cantero");
    var bLim = html("button","btn btn-2", "Sacar todas");
    fila.appendChild(bRev); fila.appendChild(bLim);
    host.appendChild(fila);

    var zonaFB = el("div"); host.appendChild(zonaFB);
    var pie = el("div"); host.appendChild(pie);

    var MACETA = '<svg viewBox="0 0 40 40" aria-hidden="true">' +
      '<ellipse cx="20" cy="37" rx="11" ry="2.2" fill="#5A3A18" opacity=".28"/>' +
      '<path d="M20 23V12" stroke="#3F8A5C" stroke-width="2.6" stroke-linecap="round"/>' +
      '<path d="M20 18 q -6.5 -1.4 -7.6 -6.8 q 6 -1 7.6 6.8z" fill="#63B884"/>' +
      '<ellipse cx="20" cy="3.6" rx="3.3" ry="2.6" fill="#F2B02A"/><ellipse cx="20" cy="12.8" rx="3.3" ry="2.6" fill="#F2B02A"/>' +
      '<ellipse cx="15.4" cy="8.2" rx="2.6" ry="3.3" fill="#F2B02A"/><ellipse cx="24.6" cy="8.2" rx="2.6" ry="3.3" fill="#F2B02A"/>' +
      '<circle cx="20" cy="8.2" r="3.1" fill="#FFF8E2"/><circle cx="20" cy="8.2" r="1.3" fill="#E5A21F"/>' +
      '<path d="M11.6 23.6h16.8l-1.9 11.2a1.8 1.8 0 0 1-1.8 1.5H15.3a1.8 1.8 0 0 1-1.8-1.5z" fill="#B96F41"/>' +
      '<path d="M12.2 27.2h15.6l-.5 3H12.7z" fill="#A05F32" opacity=".45"/>' +
      '<rect x="10" y="20.8" width="20" height="4.6" rx="2.3" fill="#CC7F4C"/>' +
      '<rect x="10" y="20.8" width="20" height="2" rx="1" fill="#E19B69" opacity=".8"/></svg>';

    function actualizar(){ contador.textContent = "Macetas plantadas: " + sel.length + " de " + pedidas; }
    function limpiarResaltado(){
      for(var q=0;q<celdas.length;q++){ celdas[q].className = celdas[q].className.replace(" resaltada",""); }
    }

    for(var i=0;i<TOTAL;i++){
      (function(pos){
        var b = el("button","hueco");
        b.setAttribute("aria-label","Casillero " + pos);
        celdas.push(b);
        b.addEventListener("click", function(){
          zonaFB.innerHTML = ""; zonaDist.innerHTML = "";
          limpiarResaltado();
          var idx = sel.indexOf(pos);
          if(idx >= 0){
            sel.splice(idx,1); b.className = "hueco"; b.innerHTML = "";
          }else{
            if(sel.length >= pedidas){
              zonaFB.appendChild(feedback("info","Ya están todas",
                "Hay " + pedidas + " macetas plantadas. Sacá una si querés cambiarla de lugar.", null));
              return;
            }
            sel.push(pos); b.className = "hueco puesta"; b.innerHTML = MACETA;
          }
          actualizar();
        });
        cantero.appendChild(b);
        reglita.appendChild(el("span",null,String(pos)));
      })(i);
    }
    actualizar();

    bLim.addEventListener("click", function(){
      sel = [];
      for(var j=0;j<celdas.length;j++){ celdas[j].className = "hueco"; celdas[j].innerHTML = ""; }
      zonaFB.innerHTML = ""; zonaDist.innerHTML = ""; pie.innerHTML = "";
      actualizar();
    });

    bRev.addEventListener("click", function(){
      zonaFB.innerHTML = ""; zonaDist.innerHTML = "";
      limpiarResaltado();
      if(sel.length !== pedidas){
        zonaFB.appendChild(feedback("info","Faltan macetas",
          "Necesitás plantar exactamente " + pedidas + " para poder revisar el cantero.", null));
        return;
      }
      var orden = sel.slice().sort(function(a,b){ return a-b; });
      var paso = orden[1]-orden[0], iguales = true, gaps = [];
      for(var j=1;j<orden.length;j++){
        var g = orden[j]-orden[j-1];
        gaps.push({de:orden[j-1], a:orden[j], d:g});
        if(g !== paso){ iguales = false; }
      }

      var chips = el("div","distancias");
      for(var k=0;k<gaps.length;k++){
        chips.appendChild(html("span","dist " + (gaps[k].d === paso ? "igual" : "difiere"),
          '<span>' + gaps[k].de + '→' + gaps[k].a + '</span><strong>' + gaps[k].d + '</strong>'));
      }
      zonaDist.appendChild(chips);

      if(iguales){
        sumar(20, bRev);
        zonaFB.appendChild(feedback("ok","Cantero perfecto",
          "Entre maceta y maceta hay siempre " + paso + " casillero(s), así que Número repite exactamente el mismo salto.",
          "En Scratch se logra usando siempre el mismo número en «mover ( ) pasos»."));
        bRev.disabled = true;
        var r = bRev.getBoundingClientRect();
        celebrar(r.left + r.width/2, r.top);
        pie.innerHTML = "";
        botonSiguiente(pie, "Terminar actividad");
      }else{
        for(var m=0;m<gaps.length;m++){
          if(gaps[m].d !== paso){
            for(var c=gaps[m].de+1; c<gaps[m].a; c++){ celdas[c].className += " resaltada"; }
          }
        }
        zonaFB.appendChild(feedback("casi","Casi…",
          "Mirá los saltos de arriba: no todos miden lo mismo. Los casilleros marcados son los que sobran o faltan.",
          "Contá cuántos casilleros vacíos hay entre una maceta y la siguiente. Tiene que ser siempre la misma cantidad."));
      }
    });
  }

  /* ============================================================
     SECUENCIA
     ============================================================ */
  function juegoSecuencia(host, act){
    var correcto = act.bloques;
    var restantes = mezclar(correcto);
    var puestos = 0, errores = 0;

    var taller = el("div","taller");

    var pA = el("div","panel");
    pA.appendChild(html("h4", null, ICO.bloques + "Bloques sueltos"));
    var listaA = el("div","pila"); pA.appendChild(listaA);

    var pB = el("div","panel destino");
    pB.appendChild(html("h4", null, ICO.banderin + "Programa de Número"));
    var listaB = el("div","pila"); pB.appendChild(listaB);

    taller.appendChild(pA); taller.appendChild(pB);
    host.appendChild(taller);

    var zonaFB = el("div"); host.appendChild(zonaFB);
    var pie = el("div"); host.appendChild(pie);

    function pintarSueltos(){
      listaA.innerHTML = "";
      if(restantes.length === 0){
        listaA.appendChild(el("p","vacio","No queda ningún bloque suelto."));
        return;
      }
      for(var i=0;i<restantes.length;i++){
        (function(bl){
          var b = html("button","bloque b-" + bl.cat,
            '<span class="cat-ic">' + CAT_ICO[bl.cat] + '</span>' + bl.t);
          b.addEventListener("click", function(){ elegir(bl); });
          listaA.appendChild(b);
        })(restantes[i]);
      }
    }

    function elegir(bl){
      zonaFB.innerHTML = "";
      if(bl === correcto[puestos]){
        var v = listaB.querySelector(".vacio");
        if(v){ listaB.innerHTML = ""; }
        listaB.appendChild(html("div","bloque puesto b-" + bl.cat + (bl.indent ? " sangria" : ""),
          '<span class="cat-ic">' + CAT_ICO[bl.cat] + '</span>' + bl.t));
        restantes.splice(restantes.indexOf(bl),1);
        puestos++;
        pintarSueltos();
        if(puestos === correcto.length){
          var gan = Math.max(10, 30 - errores*5);
          sumar(gan, pB);
          zonaFB.appendChild(feedback("ok","Programa armado",
            "Ganaste " + gan + " puntos. " + (errores > 0
              ? "Probaste " + errores + " bloque(s) fuera de orden, y así también se aprende."
              : "Lo ordenaste sin equivocarte ni una vez."), null));
          var r = pB.getBoundingClientRect();
          celebrar(r.left + r.width/2, r.top + 40);
          botonSiguiente(pie, "Terminar actividad");
        }
      }else{
        errores++;
        var cat = correcto[puestos].cat;
        zonaFB.appendChild(feedback("casi","Todavía no va ahí",
          puestos === 0
            ? "Pensá qué tiene que pasar primero de todo para que el programa arranque."
            : "Pensá qué sucede justo después de «" + correcto[puestos-1].t + "».",
          'El próximo bloque es de la categoría <span class="pill-cat" style="background:' + CAT_COL[cat] + '">' + CAT_ICO[cat] + CAT_NOM[cat] + '</span>'));
      }
    }

    pintarSueltos();
    listaB.appendChild(el("p","vacio","Acá se arma el programa, de arriba hacia abajo."));
  }

  /* ============================================================
     PAREJAS
     ============================================================ */
  function juegoParejas(host, act){
    var conceptos = mezclar(act.pares), definiciones = mezclar(act.pares);
    var elegido = null, botonElegido = null, hechas = 0;

    var grid = el("div","parejas");
    var colA = el("div","col"), colB = el("div","col");
    colA.appendChild(el("div","cab","Palabras"));
    colB.appendChild(el("div","cab","Significados"));
    grid.appendChild(colA); grid.appendChild(colB);
    host.appendChild(grid);

    var zonaFB = el("div"); host.appendChild(zonaFB);
    var pie = el("div"); host.appendChild(pie);

    function limpiar(){
      if(botonElegido){ botonElegido.className = "par-btn concepto"; }
      elegido = null; botonElegido = null;
    }

    for(var i=0;i<conceptos.length;i++){
      (function(par){
        var b = html("button","par-btn concepto",
          '<span class="pin">' + ICO.union + '</span><span>' + par.a + '</span>');
        b.addEventListener("click", function(){
          zonaFB.innerHTML = "";
          limpiar();
          elegido = par; botonElegido = b;
          b.className = "par-btn concepto elegido";
        });
        colA.appendChild(b);
      })(conceptos[i]);
    }

    for(var j=0;j<definiciones.length;j++){
      (function(par){
        var b = html("button","par-btn",
          '<span class="pin">' + ICO.circulo + '</span><span>' + par.b + '</span>');
        b.addEventListener("click", function(){
          zonaFB.innerHTML = "";
          if(!elegido){
            zonaFB.appendChild(feedback("info","Elegí primero una palabra",
              "Tocá una palabra de la izquierda y después su significado.", null));
            return;
          }
          if(elegido === par){
            sumar(10, b);
            hechas++;
            botonElegido.className = "par-btn concepto unido";
            botonElegido.querySelector(".pin").innerHTML = ICO.tilde;
            botonElegido.disabled = true;
            b.className = "par-btn unido";
            b.querySelector(".pin").innerHTML = ICO.tilde;
            b.disabled = true;
            elegido = null; botonElegido = null;
            if(hechas === act.pares.length){
              zonaFB.appendChild(feedback("ok","Uniste todas",
                "Estas son las palabras que usamos durante todo el proyecto de Número.", null));
              var r = grid.getBoundingClientRect();
              celebrar(r.left + r.width/2, r.top + 60);
              botonSiguiente(pie, "Terminar actividad");
            }else{
              zonaFB.appendChild(feedback("ok","Par correcto",
                "Quedan " + (act.pares.length - hechas) + " palabras por unir.", null));
            }
          }else{
            zonaFB.appendChild(feedback("casi","Ese no es el par",
              "Esa definición no corresponde a «" + elegido.a + "». Volvé a leerla con calma y probá otra.", null));
            limpiar();
          }
        });
        colB.appendChild(b);
      })(definiciones[j]);
    }
  }

  /* ============================================================
     CIERRE
     ============================================================ */
  function renderCierre(hoja, e){
    var d = el("div","cierre");
    d.appendChild(html("div","sello", ICO.tilde));

    /* sólo la primera vez que se llega al cierre de esta etapa */
    if(!cartelVisto[etapaActiva]){
      ranaReacciona("festeja");
      setTimeout(function(){
        var sel = d.querySelector(".sello");
        if(sel){
          var q = sel.getBoundingClientRect();
          celebrar(q.left + q.width/2, q.top + q.height/2);
        }
      }, 260);
    }
    d.appendChild(el("h2",null,"Etapa " + e.n + " completada"));
    d.appendChild(el("p","sub", e.titulo));

    var stats = el("div","stats");
    var s1 = el("div","stat");
    s1.appendChild(el("div","v","+" + puntosEtapa[etapaActiva]));
    s1.appendChild(el("div","l","en esta etapa"));
    var s2 = el("div","stat");
    s2.appendChild(el("div","v", String(puntos)));
    s2.appendChild(el("div","l","total de la sesión"));
    stats.appendChild(s1); stats.appendChild(s2);
    d.appendChild(stats);

    var ap = el("div","aprendido");
    ap.appendChild(html("span","ic", ICO.lampara));
    var apT = el("div");
    apT.appendChild(el("div","t","Lo que aprendimos"));
    apT.appendChild(el("div","d", e.concepto));
    ap.appendChild(apT);
    d.appendChild(ap);

    var meta = el("div","meta-card");
    meta.appendChild(el("div","t","Para conversar entre todos"));
    var ul = document.createElement("ul");
    for(var i=0;i<e.cierre.length;i++){ ul.appendChild(el("li",null,e.cierre[i])); }
    meta.appendChild(ul);
    d.appendChild(meta);

    var f = el("div","fila");
    var bS = html("button","btn btn-cta", ICO.cohete + "Vamos a Scratch");
    bS.addEventListener("click", function(){ mostrarCartel(e); });
    f.appendChild(bS);
    var b1 = html("button","btn btn-2","Repetir la etapa");
    b1.addEventListener("click", function(){ progreso[etapaActiva] = 0; render(); });
    f.appendChild(b1);
    if(etapaActiva < ETAPAS.length-1){
      var b2 = html("button","btn btn-2", "Etapa " + ETAPAS[etapaActiva+1].n + ICO.flecha);
      b2.addEventListener("click", function(){ etapaActiva++; render(); });
      f.appendChild(b2);
    }
    d.appendChild(f);
    hoja.appendChild(d);
  }

  /* ============================================================
     MODAL
     ============================================================ */
  function mostrarCartel(e){
    var telon = el("div","telon");
    var m = el("div","modal");
    m.setAttribute("role","dialog");
    m.setAttribute("aria-modal","true");

    m.appendChild(html("div", null,
      '<svg class="rana-svg" viewBox="0 0 116 90" aria-hidden="true">' +
      '<ellipse cx="58" cy="82" rx="32" ry="5" fill="#16532F" opacity=".14"/>' +
      /* chispas de festejo */
      '<g stroke-linecap="round" fill="none">' +
      '<path d="M30 26 l-7-10" stroke="#F2B02A" stroke-width="3.4"/>' +
      '<path d="M86 26 l7-10" stroke="#F2B02A" stroke-width="3.4"/>' +
      '<path d="M58 13 v-11" stroke="#F2B02A" stroke-width="3.4"/>' +
      '<path d="M16 44 l-9-3" stroke="#EC5F92" stroke-width="3"/>' +
      '<path d="M100 44 l9-3" stroke="#EC5F92" stroke-width="3"/></g>' +
      '<g fill="#9268D6" opacity=".8"><circle cx="20" cy="22" r="3"/><circle cx="97" cy="20" r="2.6"/></g>' +
      '<g transform="translate(58,54)">' +
      '<ellipse cx="-19" cy="9" rx="10.4" ry="5.6" fill="#227A48"/><ellipse cx="19" cy="9" rx="10.4" ry="5.6" fill="#227A48"/>' +
      '<path d="M-27 10 h-5 M-27 6.6 h-5.6 M-27 13.4 h-5" stroke="#1B6B3E" stroke-width="1.9" stroke-linecap="round"/>' +
      '<path d="M27 10 h5 M27 6.6 h5.6 M27 13.4 h5" stroke="#1B6B3E" stroke-width="1.9" stroke-linecap="round"/>' +
      '<ellipse cx="0" cy="0" rx="25" ry="17.4" fill="#3AA96A"/>' +
      '<ellipse cx="0" cy="5.4" rx="15.6" ry="9.2" fill="#DDF4E5" opacity=".72"/>' +
      '<ellipse cx="-10" cy="-8" rx="6.4" ry="4" fill="#7FD3A0" opacity=".45"/>' +
      '<circle cx="-10" cy="-17.4" r="8.8" fill="#3AA268"/><circle cx="10" cy="-17.4" r="8.8" fill="#3AA268"/>' +
      '<circle cx="-10" cy="-18.6" r="5.6" fill="#FFFDF5"/><circle cx="10" cy="-18.6" r="5.6" fill="#FFFDF5"/>' +
      '<circle cx="-8.6" cy="-18.6" r="2.9" fill="#10261C"/><circle cx="11.4" cy="-18.6" r="2.9" fill="#10261C"/>' +
      '<circle cx="-9.6" cy="-20.2" r="1.2" fill="#fff"/><circle cx="10.4" cy="-20.2" r="1.2" fill="#fff"/>' +
      '<ellipse cx="-17" cy="1" rx="4.4" ry="3" fill="#EC5F92" opacity=".32"/>' +
      '<ellipse cx="17" cy="1" rx="4.4" ry="3" fill="#EC5F92" opacity=".32"/>' +
      '<path d="M-7.4 3 q 7.4 6 14.8 0" stroke="#16532F" stroke-width="2.5" fill="none" stroke-linecap="round"/>' +
      '</g></svg>'));

    m.appendChild(el("h2",null,"Excelente, buen trabajo"));
    m.appendChild(el("p",null,"Terminaron los juegos de la Etapa " + e.n + ". Ahora llevamos lo aprendido a Scratch: esta página es la guía, el proyecto se programa allá."));
    m.appendChild(html("div","puntos-mini", ICO.estrella + " " + puntos + " puntos en la sesión"));

    var f = el("div","fila");
    var a = document.createElement("a");
    a.className = "btn btn-cta";
    a.href = URL_SCRATCH;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = ICO.cohete + "Vamos a Scratch";
    f.appendChild(a);
    var b = html("button","btn btn-2","Quedarme acá");
    b.addEventListener("click", cerrar);
    f.appendChild(b);
    m.appendChild(f);
    m.appendChild(el("p","nota","Scratch se abre en otra pestaña, así no perdés lo que hiciste acá."));

    function cerrar(){
      if(telon.parentNode){ document.body.removeChild(telon); }
      document.removeEventListener("keydown", porTecla);
    }
    function porTecla(ev){ if(ev.keyCode === 27){ cerrar(); } }
    telon.addEventListener("click", function(ev){ if(ev.target === telon){ cerrar(); } });
    document.addEventListener("keydown", porTecla);

    telon.appendChild(m);
    document.body.appendChild(telon);
    a.focus();
  }

  render();
})();
</script>
